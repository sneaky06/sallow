<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sallow">
<meta name="theme-color" content="#0b0a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Sallow</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a0f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot-error { position: fixed; left: 8px; bottom: 8px; right: 8px; color: #f66; font: 11px monospace;
    white-space: pre-wrap; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot-error"></div>
<script>
// Loader: classic scripts (no ES modules) so the game runs from file:// and any static host.
// Each team lists its files in src/<team>/manifest.js via  G.manifest.<team> = ['a.js', 'b.js'].
window.G = { manifest: {} };
(function () {
  var errBox = document.getElementById('boot-error');
  window.addEventListener('error', function (e) {
    errBox.textContent += (e.message || 'error') + ' @ ' + (e.filename || '').split('/').slice(-2).join('/') + ':' + e.lineno + '\n';
  });
  var TEAMS = ['engine', 'world', 'items', 'game', 'ui'];
  var CORE = ['constants.js', 'events.js', 'rng.js', 'state.js', 'scenes.js'];
  function load(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = resolve;
      s.onerror = function () { console.warn('[loader] missing ' + src); resolve(); };
      document.body.appendChild(s);
    });
  }
  function seq(list) { return list.reduce(function (p, src) { return p.then(function () { return load(src); }); }, Promise.resolve()); }
  seq(CORE.map(function (f) { return 'src/core/' + f; }))
    .then(function () { return seq(TEAMS.map(function (t) { return 'src/' + t + '/manifest.js'; })); })
    .then(function () {
      var files = [];
      TEAMS.forEach(function (t) { (G.manifest[t] || []).forEach(function (f) { files.push('src/' + t + '/' + f); }); });
      return seq(files);
    })
    .then(function () { return load('src/core/main.js'); });
})();
</script>
</body>
</html>
