<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sallow — world harness</title>
<style>
  body { margin: 0; background: #111016; color: #d8d4c8; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: #1b1922; position: sticky; top: 0; }
  button, input { font: inherit; background: #2b2836; color: #eee; border: 1px solid #4a4560; padding: 4px 8px; }
  button:hover { background: #3a3650; }
  input[type=number] { width: 110px; }
  #wrap { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; }
  canvas { background: #000; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
  #side { flex: 1; min-width: 280px; }
  pre { margin: 0 0 10px; white-space: pre-wrap; }
  .ok { color: #7fe08a; } .bad { color: #ff6b6b; }
  #legend span { display: inline-block; margin-right: 10px; }
  #legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="bar">
  <button id="bTown">Town</button>
  <button id="bPrev">Depth −</button>
  <b id="lDepth">depth 1</b>
  <button id="bNext">Depth +</button>
  seed <input id="iSeed" type="number" value="12345">
  <button id="bSeed">Reseed</button>
  <label><input id="cFog" type="checkbox" checked> visibility mask</label>
  <label><input id="cRooms" type="checkbox" checked> rooms</label>
  <button id="bCheck">Run automated checks</button>
</div>
<div id="wrap">
  <canvas id="cv" width="640" height="640"></canvas>
  <div id="side">
    <div id="legend"></div>
    <pre id="info"></pre>
    <pre id="path">Click two tiles to path between them. Drag the white dot to walk it with moveWithCollision.</pre>
    <pre id="out"></pre>
  </div>
</div>
<script>
window.G = { manifest: {} };
(function () {
  'use strict';
  const errors = [];
  window.addEventListener('error', function (e) { errors.push(e.message + ' @ ' + e.filename + ':' + e.lineno); });
  window.__errors = errors;

  function load(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('missing ' + src)); };
      document.body.appendChild(s);
    });
  }
  const seq = function (list) { return list.reduce(function (p, src) { return p.then(function () { return load(src); }); }, Promise.resolve()); };

  seq(['constants.js', 'events.js', 'rng.js', 'state.js', 'scenes.js'].map(function (f) { return '../src/core/' + f; }))
    .then(function () { return load('../src/world/manifest.js'); })
    .then(function () { return seq(G.manifest.world.map(function (f) { return '../src/world/' + f; })); })
    .then(init)
    .catch(function (err) { document.getElementById('out').textContent = 'LOAD FAILED: ' + err.message; errors.push(String(err)); });

  function init() {
    const C = G.C, T = C.TILE, W = G.world;
    const $ = function (id) { return document.getElementById(id); };
    const cv = $('cv'), g = cv.getContext('2d');
    const TILE_COL = ['#000000', '#4b4656', '#8d879c', '#b07a3a', '#35e0ff', '#ffe45b', '#2a5fb8', '#2f6b35', '#9a8a66', '#ff5a1e', '#8a5a2b', '#6a6470', '#12306a', '#8a1f08', '#1d1430'];
    const ROOM_COL = { start: '#ffe45b', normal: '#777', treasure: '#ffd700', elite: '#b65bff', boss: '#ff3b4e', shrine: '#5bffd0', exit: '#35e0ff', lockdown: '#ff7ad9' };
    const SPAWN_COL = { monster: '#ffb347', pack: '#ff8a2b', elite: '#b65bff', boss: '#ff3b4e', npc: '#3ddc6a' };
    const PROP_COL = { chest: '#ffd700', chest_open: '#a08a30', barrel: '#a86a32', crate: '#c08a4a', torch: '#ffcf5a', shrine: '#5bffd0',
      pillar: '#cfcfe0', bones: '#e8e4d0', stash: '#ffa0ff', portal: '#7fd4ff', dungeon_entrance: '#ff3b4e', waypoint: '#7fd4ff',
      tree: '#1c4a22', bush: '#3f8a45', fountain: '#6fb8ff', sign: '#d0b070', stall: '#e07050', well: '#6080a0', tombstone: '#9aa0a8',
      crystal: '#c07bff', campfire: '#ff7a2b', gate: '#ffffff', corpse: '#ff2bd0' };
    $('legend').innerHTML = Object.keys(SPAWN_COL).map(function (k) { return '<span><i style="background:' + SPAWN_COL[k] + ';border-radius:5px"></i>' + k + '</span>'; }).join('') +
      '<br>' + Object.keys(ROOM_COL).map(function (k) { return '<span><i style="border:2px solid ' + ROOM_COL[k] + ';width:6px;height:6px"></i>' + k + '</span>'; }).join('');

    let depth = 1, map = null, S = 8, lastGenMs = 0;
    const dot = { x: 0, y: 0, radius: 0.3 };
    let dragging = false, target = null, clicks = [], path = null, lastVisTile = -1;

    function regen() {
      const seed = (+$('iSeed').value >>> 0) || 1;
      const t0 = performance.now();
      map = depth === 0 ? W.generateTown(seed) : W.generateDungeon(depth, seed);
      lastGenMs = performance.now() - t0;
      S = Math.max(4, Math.floor(640 / Math.max(map.w, map.h)));
      cv.width = map.w * S; cv.height = map.h * S;
      dot.x = map.spawn.x + 0.5; dot.y = map.spawn.y + 0.5;
      clicks = []; path = null; lastVisTile = -1;
      $('lDepth').textContent = depth === 0 ? 'town' : 'depth ' + depth + ' (' + map.theme + (depth % C.BOSS_EVERY === 0 ? ', boss' : '') + ')';
      let monsters = 0;
      for (const s of map.spawns) monsters += s.kind === 'pack' ? s.count : (s.kind === 'npc' ? 0 : 1);
      const kinds = {};
      for (const s of map.spawns) kinds[s.kind] = (kinds[s.kind] || 0) + 1;
      $('info').textContent = map.w + 'x' + map.h + '  seed ' + map.seed + '  gen ' + lastGenMs.toFixed(1) + ' ms\n' +
        'rooms ' + map.rooms.length + ' [' + map.rooms.map(function (r) { return r.type[0]; }).join('') + ']\n' +
        'spawns ' + JSON.stringify(kinds) + '  monsters ' + monsters + '\nprops ' + map.props.length;
      window.__map = map;
    }

    function draw() {
      if (!map) return;
      const fog = $('cFog').checked && map.kind !== 'town';
      g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
      for (let y = 0; y < map.h; y++) {
        for (let x = 0; x < map.w; x++) {
          const i = y * map.w + x, t = map.tiles[i];
          if (t === T.VOID && !(fog && map.visible[i])) continue;
          g.globalAlpha = fog ? (map.visible[i] ? 1 : map.explored[i] ? 0.45 : 0.14) : 1;
          g.fillStyle = t === T.VOID ? '#15131d' : TILE_COL[t];
          g.fillRect(x * S, y * S, S, S);
        }
      }
      g.globalAlpha = 1;
      if ($('cRooms').checked) {
        g.lineWidth = 2;
        for (const r of map.rooms) { g.strokeStyle = ROOM_COL[r.type] || '#fff'; g.strokeRect(r.x * S + 1, r.y * S + 1, r.w * S - 2, r.h * S - 2); }
      }
      for (const p of map.props) {
        g.fillStyle = PROP_COL[p.type] || '#f0f';
        const m = p.solid ? 1 : Math.max(1, S * 0.3);
        g.fillRect(p.x * S + m, p.y * S + m, S - 2 * m, S - 2 * m);
        if (p.interact) { g.strokeStyle = '#fff'; g.lineWidth = 1; g.strokeRect(p.x * S + 0.5, p.y * S + 0.5, S - 1, S - 1); }
      }
      for (const s of map.spawns) {
        g.fillStyle = SPAWN_COL[s.kind] || '#f0f';
        g.beginPath();
        g.arc((s.x + 0.5) * S, (s.y + 0.5) * S, s.kind === 'boss' ? S : s.kind === 'elite' ? S * 0.7 : S * 0.5, 0, 6.3);
        g.fill();
        if (s.count || s.role) { g.fillStyle = '#000'; g.font = 'bold ' + S + 'px monospace'; g.fillText(s.count || s.role[0].toUpperCase(), (s.x + 0.2) * S, (s.y + 0.9) * S); }
      }
      if (path) {
        g.strokeStyle = '#3dff7a'; g.lineWidth = 2; g.beginPath();
        g.moveTo((clicks[0].x + 0.5) * S, (clicks[0].y + 0.5) * S);
        for (const p of path) g.lineTo(p.x * S, p.y * S);
        g.stroke();
        g.fillStyle = '#3dff7a';
        for (const p of path) g.fillRect(p.x * S - 2, p.y * S - 2, 4, 4);
      }
      for (const c of clicks) { g.strokeStyle = '#3dff7a'; g.lineWidth = 2; g.strokeRect(c.x * S + 1, c.y * S + 1, S - 2, S - 2); }
      g.fillStyle = '#fff'; g.beginPath(); g.arc(dot.x * S, dot.y * S, dot.radius * S, 0, 6.3); g.fill();
      g.strokeStyle = '#000'; g.lineWidth = 1; g.stroke();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (map && target) {
        const dx = target.x - dot.x, dy = target.y - dot.y, d = Math.hypot(dx, dy);
        if (d > 0.02) { const s = Math.min(d, 9 * dt); W.moveWithCollision(map, dot, dx / d * s, dy / d * s); }
      }
      if (map) {
        const ti = Math.floor(dot.y) * map.w + Math.floor(dot.x);
        if (ti !== lastVisTile) { lastVisTile = ti; W.updateVisibility(map, dot.x, dot.y); }
      }
      draw();
      requestAnimationFrame(frame);
    }

    const toWorld = function (e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width / S, y: (e.clientY - r.top) * cv.height / r.height / S }; };
    cv.addEventListener('pointerdown', function (e) {
      const p = toWorld(e);
      if (Math.hypot(p.x - dot.x, p.y - dot.y) < 1) { dragging = true; target = p; cv.setPointerCapture(e.pointerId); return; }
      if (clicks.length >= 2) { clicks = []; path = null; }
      clicks.push({ x: Math.floor(p.x), y: Math.floor(p.y) });
      if (clicks.length === 2) {
        const t0 = performance.now();
        path = W.findPath(map, clicks[0].x, clicks[0].y, clicks[1].x, clicks[1].y);
        const ms = performance.now() - t0;
        $('path').textContent = path ? 'path: ' + path.length + ' waypoints, ' + ms.toFixed(2) + ' ms' : 'path: null (' + ms.toFixed(2) + ' ms)';
      }
    });
    cv.addEventListener('pointermove', function (e) { if (dragging) target = toWorld(e); });
    const stop = function () { dragging = false; target = null; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);

    $('bTown').onclick = function () { depth = 0; regen(); };
    $('bPrev').onclick = function () { depth = Math.max(1, depth - 1); regen(); };
    $('bNext').onclick = function () { depth = depth + 1; regen(); };
    $('bSeed').onclick = function () { $('iSeed').value = (Math.random() * 0x7fffffff) | 0; regen(); };
    $('iSeed').onchange = regen;
    $('bCheck').onclick = function () { $('out').textContent = 'running…'; setTimeout(function () { runChecks(); }, 30); };
    window.__setDepth = function (d, seed) { depth = d; if (seed !== undefined) $('iSeed').value = seed; regen(); };

    // =====================================================================================================
    // Automated checks
    // =====================================================================================================
    const DRY = C.WALKABLE.slice(); DRY[T.WATER] = 0; DRY[T.LAVA] = 0;
    const LIQ = []; LIQ[T.WATER] = LIQ[T.LAVA] = LIQ[T.DEEP_WATER] = LIQ[T.DEEP_LAVA] = 1;
    // 4-connected flood from the spawn (or `from`). dry = true ignores shallow water/lava as footing.
    function flood(map, blockSolid, mask, dry, from) {
      const w = map.w, n = w * map.h, tiles = map.tiles, ok = dry ? DRY : C.WALKABLE;
      const blocked = new Uint8Array(n);
      if (blockSolid) for (const p of map.props) if (p.solid && !p.secret) blocked[p.y * w + p.x] = 1;
      if (mask) for (let i = 0; i < n; i++) if (mask[i]) blocked[i] = 1;
      const dist = new Int32Array(n).fill(-1), q = [from === undefined ? map.spawn.y * w + map.spawn.x : from];
      dist[q[0]] = 0;
      for (let qh = 0; qh < q.length; qh++) {
        const i = q[qh], x = i % w;
        for (const j of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, i - w, i + w]) {
          if (j < 0 || j >= n || dist[j] >= 0 || !ok[tiles[j]] || blocked[j]) continue;
          dist[j] = dist[i] + 1; q.push(j);
        }
      }
      return { dist, count: q.length };
    }

    const HEX = /^#[0-9a-f]{6}$/i, PARTICLES = ['mist', 'ash', 'ember', 'spore', 'drip', 'snow', 'motes', 'void', 'none'];
    const SOUNDS = ['wind', 'drone', 'drip', 'fire', 'heart', 'choir', 'water', 'none'];
    function checkVariant(map, depth, R, ok) {
      const v = map.variant;
      if (!ok(v && typeof v === 'object', 'map.variant missing')) return;
      ok(typeof v.id === 'string' && typeof v.name === 'string' && v.name.length > 2 && typeof v.layout === 'string', 'variant id/name/layout');
      const def = W.VARIANTS.find(function (d) { return d.id === v.id; });
      ok(def && def.theme === map.theme && depth >= def.min && depth <= def.max, 'variant ' + v.id + ' not valid for depth ' + depth);
      ok(depth > 20 || !def || def.min <= 20, 'deep-only variant above its depth');
      ok(v.layout === 'fallback' || !!W._gen.layouts[v.layout], 'unknown layout ' + v.layout);
      ok(typeof map.floorName === 'string' && map.floorName.length >= 6, 'floorName');
      const p = v.palette, l = v.light, a = v.ambient;
      const rng = function (x, lo, hi) { return typeof x === 'number' && x >= lo && x <= hi; };
      ok(p && HEX.test(p.tint) && rng(p.amount, 0, 1) && rng(p.saturation, 0.1, 1.6) && rng(p.brightness, 0.6, 1.3) && HEX.test(p.accent) && (p.liquid === null || HEX.test(p.liquid)), 'palette fields');
      ok(l && HEX.test(l.color) && rng(l.radius, 4, 10) && HEX.test(l.ambient) && HEX.test(l.torch) && rng(l.torchRadius, 0.6, 1.5) && rng(l.flicker, 0, 1), 'light fields');
      ok(a && rng(a.darkness, 0, 0.8) && rng(a.fog, 0, 1) && SOUNDS.indexOf(a.sound) >= 0 && rng(a.darkness, 0, 0.8) &&
        PARTICLES.indexOf(a.particles) >= 0 && HEX.test(a.color) && rng(a.density, 0, 2), 'ambient fields');
      ok(v.blend === null || (['crypt', 'caves', 'inferno'].indexOf(v.blend.theme) >= 0 && rng(v.blend.amount, 0, 1)), 'blend field');
      ok(depth <= 20 || v.blend !== null || def.min <= 20, 'deep floor not blended');
      try { JSON.parse(JSON.stringify(v)); } catch (e) { ok(false, 'variant not JSON'); }
      R.variants[v.id] = (R.variants[v.id] || 0) + 1;
      R.layouts[v.layout] = (R.layouts[v.layout] || 0) + 1;
      R.attempts[W._lastAttempts] = (R.attempts[W._lastAttempts] || 0) + 1;
      if (v.layout === 'fallback') R.fallbacks++;
      if (R.wanted && v.layout !== R.wanted) R.layoutSwaps++;
      R.names[map.floorName] = 1;
      const w = map.w, h = map.h;
      ok(Array.isArray(map.landmarks) && map.landmarks.length <= 4, 'landmarks array');
      { const b = v.monsterBias; ok(b && Array.isArray(b.tags) && b.tags.length >= 1 && b.tags.every(function (s) { return typeof s === 'string'; }) && Array.isArray(b.monsterIds) && b.monsterIds.length >= 3 && b.monsterIds.every(function (s) { return /^[a-z_]+$/.test(s); }) && rng(b.weight, 0.3, 0.9), 'variant.monsterBias'); }
      for (const lm of map.landmarks || []) {
        ok(W._gen.LANDMARKS[lm.id] && lm.x >= 1 && lm.y >= 1 && lm.x + lm.w <= w - 1 && lm.y + lm.h <= h - 1 && lm.w > 0 && lm.h > 0 && typeof lm.name === 'string', 'landmark fields ' + lm.id);
        R.landmarks[lm.id] = (R.landmarks[lm.id] || 0) + 1;
        const inLm = function (q) { return q.x >= lm.x && q.y >= lm.y && q.x < lm.x + lm.w && q.y < lm.y + lm.h; };
        const chests = map.props.filter(function (q) { return q.type === 'chest' && inLm(q); }).length;
        if (lm.id === 'dash_gap') {
          R.dashGaps = (R.dashGaps || 0) + 1;
          ok(Array.isArray(lm.gap) && lm.gap.length === 2 && lm.gap.every(function (g) { return map.tiles[g.y * w + g.x] === T.CHASM; }) && depth >= 4 && map.theme !== 'abyss', 'dash gap fields');
          ok(chests <= 3, 'dash gap chests ' + chests);
          const g0 = lm.gap[0], g1 = lm.gap[1], dx = g1.x - g0.x, dy = g1.y - g0.y;
          const side = function (g, sx, sy) { return DRY[map.tiles[(g.y + sy) * w + g.x + sx]] === 1; };
          ok(side(g0, -dx, -dy) && side(g1, dx, dy), 'dash gap ends are not walkable');
          
        } else if (lm.id === 'hidden_cache') {
          const crates = map.props.filter(function (q) { return q.secret === true && inLm(q); });
          ok(crates.length === 1 && crates[0].type === 'crate' && crates[0].interact === 'barrel' && crates[0].solid, 'cache needs one secret crate');
          ok(chests === 1, 'cache chest count ' + chests);
          const mask = new Uint8Array(w * h);
          if (crates[0]) mask[crates[0].y * w + crates[0].x] = 1;
          const sealed = flood(map, true, mask, true), opened = flood(map, true, null, true);
          const ch = map.props.find(function (q) { return q.type === 'chest' && inLm(q); });
          if (ch) {
            let a1 = false, a2 = false;
            for (const j of [ch.y * w + ch.x - 1, ch.y * w + ch.x + 1, (ch.y - 1) * w + ch.x, (ch.y + 1) * w + ch.x]) { if (sealed.dist[j] >= 0) a1 = true; if (opened.dist[j] >= 0) a2 = true; }
            ok(!a1, 'cache reachable without breaking the crate');
            ok(a2, 'cache chest unreachable even with the crate gone');
          }
          for (const s of map.spawns) ok(!inLm(s), 'spawn inside the cache');
        } else {
          const room = map.rooms.find(function (r) { return r.x === lm.x && r.y === lm.y && r.w === lm.w && r.h === lm.h; });
          ok(!!room && room.type !== 'lockdown' && room.type !== 'start' && room.type !== 'exit' && room.type !== 'boss', 'landmark is not a plain room (' + (room && room.type) + ')');
          if (lm.id === 'chained_arena') {
            const el = map.spawns.filter(function (s) { return s.kind === 'elite' && inLm(s); });
            R.arenaTotal++; if (el.length === 1) R.arenaElite++;
            ok(map.props.filter(function (q) { return q.type === 'pillar' && inLm(q); }).length >= 1, 'chained arena pillars');
          } else if (lm.id === 'crystal_grotto') ok(map.props.filter(function (q) { return q.type === 'crystal' && inLm(q); }).length >= 2, 'grotto crystals');
          else if (lm.id === 'pyre_court') ok(map.props.filter(function (q) { return q.type === 'campfire' && inLm(q); }).length >= 1, 'pyre campfires');
          else if (lm.id === 'bone_garden') { const gt = map.props.filter(function (q) { return (q.type === 'tree' || q.type === 'tombstone') && inLm(q); }).length; if (!gt) R.bareGardens = (R.bareGardens || 0) + 1; ok(gt >= 1 || R.bareGardens <= 3, 'garden trees/tombstones'); }
          else { R.payoffTotal++; if (chests >= 1) R.payoffChest++; }
          if (lm.id === 'flooded_crypt' || lm.id === 'forge_island') {
            let liq = 0;
            for (let y = lm.y; y < lm.y + lm.h; y++) for (let x = lm.x; x < lm.x + lm.w; x++) if (LIQ[map.tiles[y * w + x]]) liq++;
            ok(liq >= 8, lm.id + ' has no pool (' + liq + ')');
          }
        }
      }
    }

    // ---- R6.5 corruption: level by depth, fissures, taint mask, props, core arena ----
    const LOOKS = ['growth', 'vein', 'rift_shrine', 'rift_crystal', 'rift_core', 'rift_shard', 'capped'];
    function checkCorruption(map, depth, R, ok) {
      const w = map.w, h = map.h, n = w * h, c = map.corruption;
      ok(typeof c === 'number' && c >= 0 && c <= 1 && c === W.corruptionForDepth(depth), 'map.corruption ' + c);
      ok(depth === 1 || c >= W.corruptionForDepth(depth - 1), 'corruption not monotonic');
      ok((depth >= W.CORE_DEPTH) === (c === 1), 'corruption reaches 1 exactly at the core depth');
      const rf = map.rift;
      ok(rf && Number.isInteger(rf.tier) && rf.tier >= 0 && rf.tier <= 4 && HEX.test(rf.glow) && HEX.test(rf.vein) && rf.pulse >= 0 && rf.pulse <= 1, 'rift fields');
      ok(map.variant.corruption === c, 'variant.corruption');
      ok(map.act === W.actForDepth(depth) && ['shallows', 'deep', 'hellscape', 'endless'].indexOf(map.act) >= 0 && map.cleansed === false && Array.isArray(map.camps) && map.camps.length === 0, 'map.act / cleansed fields');
      ok(map.taint instanceof Uint8Array && map.taint.length === n, 'taint array');
      let tainted = 0, walkTiles = 0, bad = 0;
      for (let i = 0; i < n; i++) {
        if (map.taint[i] > 3) bad++;
        if (map.tiles[i] === T.VOID && map.taint[i]) bad++;
        if (C.WALKABLE[map.tiles[i]]) { walkTiles++; if (map.taint[i]) tainted++; }
      }
      ok(bad === 0, 'taint values out of range (' + bad + ')');
      const share = tainted / Math.max(1, walkTiles);
      (R.taintByBand[Math.min(5, Math.floor((depth - 1) / 10))] = R.taintByBand[Math.min(5, Math.floor((depth - 1) / 10))] || []).push(share);
      ok(Array.isArray(map.fissures), 'fissures array');
      if (depth <= 6) ok(map.fissures.length === 0, 'fissure above the first threshold');
      for (const f of map.fissures) {
        ok(['chasm', 'lava'].indexOf(f.kind) >= 0 && f.cells.length >= 10 && f.cells.length % 2 === 0, 'fissure fields');
        ok(f.x >= 1 && f.y >= 1 && f.x + f.w <= w - 1 && f.y + f.h <= h - 1, 'fissure rect');
        let onTile = 0;

      const ft = solid && W.findFreeTileNear(big, solid.x + 0.5, solid.y + 0.5);
      if (solid && !(ft && W.isWalkable(big, ft.x, ft.y) && Math.abs(ft.x - solid.x) <= 1 && Math.abs(ft.y - solid.y) <= 1)) { R.failed++; R.failures.push('findFreeTileNear'); }
      // prop mutation is picked up by the lazy lookup
      if (solid) {
        R.asserts += 2;
        solid.solid = false; W.invalidate(big);
        if (!W.isWalkable(big, solid.x, solid.y)) { R.failed++; R.failures.push('solid=false not picked up'); }
        const idx = big.props.indexOf(solid);
        big.props.splice(idx, 1);
        if (W.propAt(big, solid.x, solid.y) !== null) { R.failed++; R.failures.push('removed prop still returned by propAt'); }
      }

      // ---- R6.5 trends: the deeper, the worse ----
      {
        const avg = function (a) { let s = 0; for (const v of a || []) s += v; return a && a.length ? s / a.length : 0; };
        const tb = [], fb = [], gb = [];
        for (let b = 0; b < 6; b++) { tb.push(avg(R.taintByBand[b])); fb.push(avg(R.fissureByBand[b])); gb.push(avg(R.growthByBand[b])); }
        R.trend = { taintShare: tb.map(function (v) { return +v.toFixed(3); }), fissures: fb.map(function (v) { return +v.toFixed(2); }), growthsAndVeins: gb.map(function (v) { return +v.toFixed(1); }) };
        R.asserts += 8;
        const need = function (cond, msg) { if (!cond) { R.failed++; R.failures.push('trend: ' + msg); } };
        need(tb[4] > tb[0] + 0.15 && tb[5] > tb[2], 'taint share does not rise with depth ' + JSON.stringify(R.trend.taintShare));
        need(fb[0] < 1.5 && fb[2] > 1 && fb[2] > fb[0] && fb[1] >= fb[0], 'fissures do not rise with depth ' + JSON.stringify(R.trend.fissures));
        need(gb[0] < gb[1] && gb[1] < gb[2] && gb[5] > 10, 'growths/veins do not rise with depth ' + JSON.stringify(R.trend.growthsAndVeins));
        need(R.riftShrines > 20, 'too few rift shrines (' + R.riftShrines + ')');
        need(R.coreMaps >= 10, 'core floors checked ' + R.coreMaps);
        const c1 = W.generateDungeon(60, 4242), c2 = W.generateDungeon(W.CORE_DEPTH + 1, 4242);
        need(c1.corruption === 1 && c2.corruption === 1 && c1.core === null && c2.core === null, 'depth 51+ should be plain deep floors at corruption 1');
        need(W.generateDungeon(W.CORE_DEPTH, 4242).core && W.generateDungeon(W.CORE_DEPTH, 4242).variant.id === 'rift_core', 'depth 50 is the core floor');
        need(W.corruptionForDepth(1) > 0 && W.corruptionForDepth(1) < 0.05, 'depth 1 corruption');
      }
      // ---- R7.7 cleansed acts: fewer monsters, friendly camps, lower corruption; acts line up with depth ----
      {
        R.asserts += 6;
        const need2 = function (cond, msg) { if (!cond) { R.failed++; R.failures.push('cleansed: ' + msg); } };
        need2(W.actForDepth(10) === 'shallows' && W.actForDepth(11) === 'deep' && W.actForDepth(21) === 'hellscape' && W.actForDepth(31) === 'endless' && W.CORE_DEPTH === 30, 'act boundaries');
        let base = 0, clean = 0, npcs = 0, camps = 0, nmaps = 0, cor = 0, cor0 = 0;
        const total = function (m) { let t = 0; for (const s of m.spawns) t += s.kind === 'pack' ? s.count : s.kind === 'npc' ? 0 : s.kind === 'elite' ? 3 : 1; return t; };
        for (let d = 2; d <= 29; d++) {
          if (d % C.BOSS_EVERY === 0) continue;
          for (let k = 0; k < 3; k++) {
            const seed = d * 911 + k * 77;
            const a = W.generateDungeon(d, seed, { cleansed: [] }), b = W.generateDungeon(d, seed, { cleansed: [W.actForDepth(d)] });
            base += total(a); clean += total(b); cor0 += a.corruption; cor += b.corruption; nmaps++;
            need2(b.cleansed === true && a.cleansed === false, 'flag d' + d);
            for (const s of b.spawns) if (s.kind === 'npc') { npcs++; need2(['refugee', 'camp_merchant'].indexOf(s.role) >= 0 && W.isWalkable(b, s.x, s.y) && s.camp === true, 'npc spawn d' + d); }
            camps += b.camps.length;
            need2(JSON.stringify(b.spawns).length > 0 && sig(b) === sig(W.generateDungeon(d, seed, { cleansed: [W.actForDepth(d)] })), 'cleansed determinism d' + d);
          }
        }
        need2(clean < base * 0.65 && npcs >= nmaps && camps >= nmaps * 0.8 && cor < cor0 * 0.6, 'effects base ' + base + ' clean ' + clean + ' npcs ' + npcs + ' camps ' + camps + '/' + nmaps);
        const viaBoss = W.generateDungeon(7, 555, { cleansed: ['boss_broodmother'] });
        need2(viaBoss.cleansed === true && W.generateDungeon(13, 555, { cleansed: ['boss_broodmother'] }).cleansed === false, 'act boss id counts');
        R.cleansedInfo = 'cleansed monsters ' + clean + '/' + base + ', npcs ' + npcs + ', camps ' + camps + '/' + nmaps;
      }
      { const same = function (d) { const a = W.generateDungeon(d, 11), b = W.generateDungeon(d, 987654); return a.tiles.join() === b.tiles.join() && JSON.stringify(a.rooms) === JSON.stringify(b.rooms) && JSON.stringify(a.props) === JSON.stringify(b.props) && JSON.stringify(a.spawns) === JSON.stringify(b.spawns) && a.seed === 11 && b.seed === 987654; };
        for (const d of [5, 10, 15, 20, 25, 30, 35, 60]) { R.asserts++; if (!same(d)) { R.failed++; R.failures.push('boss floor ' + d + ' differs between seeds'); } }
        R.asserts++; if (same(7)) { R.failed++; R.failures.push('ordinary floors should still vary by seed'); } }
      R.genStats = stats(R.genMs);
      const lines = [];
      lines.push((R.failed ? 'FAIL' : 'PASS') + ' — ' + R.maps + ' dungeons (depth 1–60) + 10 towns, ' + R.asserts + ' assertions, ' + R.failed + ' failed, ' + window.__errors.length + ' script errors');
      lines.push('generation ms/map: ' + R.genStats);
      for (const th in R.byTheme) lines.push('  ' + th + ': ' + stats(R.byTheme[th]));
      lines.push('monsters/map: ' + stats(R.monsters) + '   props/map: ' + stats(R.props) + '   chests/map: ' + stats(R.chests));
      lines.push('walk distance spawn→stairs (tiles): ' + stats(R.exitDist));
      lines.push('findPath spawn→stairs, uncapped (ms): ' + stats(R.longPathMs));
      lines.push('findPath random pair, default cap 2000 (ms): ' + stats(pathMs) + '   null ' + pathNull + ', partial ' + partial + ' of ' + pathCalls);
      lines.push('findPath goal within 12 tiles (ms): ' + stats(localMs));
      lines.push('updateVisibility r=9 on ' + big.w + 'x' + big.h + ': ' + (visMs * 1000).toFixed(1) + ' µs/call   moveWithCollision: ' + moveUs.toFixed(2) + ' µs/call');
      lines.push('lockdown rooms by theme ' + JSON.stringify(R.lockdowns) + '   spawn→stairs paths touching lava: ' + R.lavaOnMainPath + '/' + R.maps);
      lines.push('liquid tiles (theme:tile) ' + JSON.stringify(R.liquid));
      lines.push('variants ' + JSON.stringify(R.variants));
      lines.push('layouts ' + JSON.stringify(R.layouts));
      lines.push('landmarks ' + JSON.stringify(R.landmarks) + '  chained-arena elite ' + R.arenaElite + '/' + R.arenaTotal + '  chest at moat/span ' + R.payoffChest + '/' + R.payoffTotal);
      lines.push('attempts needed ' + JSON.stringify(R.attempts) + '  fallback layout ' + R.fallbacks + '  forced layout swapped for the plain one ' + R.layoutSwaps + ' of ' + R.forced + '  distinct floor names ' + Object.keys(R.names).length);
      lines.push('corruption trend by 10-depth band: taint share ' + JSON.stringify(R.trend.taintShare) + '  fissures/map ' + JSON.stringify(R.trend.fissures) + '  growths+veins/map ' + JSON.stringify(R.trend.growthsAndVeins) + '  rift shrines ' + R.riftShrines + '  core floors ' + R.coreMaps);
      lines.push('floor flow ' + JSON.stringify(R.flows));
      lines.push('bargain shrines on ' + R.bargainFloors + '/' + R.bargainTotal + ' floors (depth 3+), dash gaps ' + R.dashGaps);
      lines.push(R.cleansedInfo + '  chute distance from centre: ' + stats(R.chuteDist || []));
      lines.push('rooms ' + JSON.stringify(R.roomTypes));
      lines.push('spawns ' + JSON.stringify(R.spawnKinds));
      lines.push('props ' + JSON.stringify(R.propTypes));
      if (R.failures.length) lines.push('', 'first failures:', R.failures.slice(0, 40).join('\n'));
      const out = $('out');
      out.textContent = lines.join('\n');
      out.className = R.failed ? 'bad' : 'ok';
      R.summary = lines.join('\n');
      window.__result = R;
      regen();
      return R;
    }
    window.runChecks = runChecks;

    regen();
    requestAnimationFrame(frame);
  }
})();
</script>
