<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emberdeep — combat harness</title>
<style>
  html, body { margin: 0; background: #0b0a0f; color: #c8c8c8; font: 12px/1.35 Consolas, monospace; }
  #bar { padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border-bottom: 1px solid #2a2833; }
  #bar button, #bar select, #bar input { font: inherit; background: #1b1a22; color: #ddd; border: 1px solid #44414f; padding: 3px 7px; }
  #bar button:hover { background: #2a2833; cursor: pointer; }
  #bar .sep { width: 10px; }
  #bar input { width: 42px; }
  #wrap { display: flex; gap: 8px; padding: 8px; align-items: flex-start; }
  #cv { background: #000; border: 1px solid #2a2833; image-rendering: pixelated; flex: none; }
  #side { flex: 1; min-width: 300px; }
  pre { margin: 0 0 8px; white-space: pre-wrap; }
  #results { max-height: 520px; overflow: auto; border: 1px solid #2a2833; padding: 6px; }
  .pass { color: #5bd67a; } .fail { color: #ff5b5b; font-weight: bold; } .info { color: #8fa3c9; }
  #errors { color: #ff5b5b; }
</style>
</head>
<body>
<div id="bar">
  <b>Class</b>
  <button data-class="warrior">Warrior</button><button data-class="ranger">Ranger</button>
  <button data-class="sorcerer">Sorcerer</button><button data-class="necromancer">Necromancer</button>
  <span class="sep"></span><b>Auto-build</b>
  <button data-mode="single">Single</button><button data-mode="aoe">Group</button><button data-mode="balanced">Balanced</button><button data-mode="">Manual</button>
  <button id="respec">Respec</button>
  <span class="sep"></span>
  <button id="lvl1">Level +1</button><button id="lvl5">+5</button>
  gear <input id="gear" type="number" value="1" min="0" max="80">
  <span class="sep"></span>
  depth <input id="depth" type="number" value="1" min="1" max="200">
  <button id="dungeon">Dungeon</button><button id="arena">Empty arena</button><button id="town">Town</button>
  <span class="sep"></span>
  <select id="mon"></select>
  <select id="rar"><option>normal</option><option>champion</option><option>rare</option></select>
  <button id="spawn">Spawn</button><button id="pack">Pack ×5</button><button id="boss">Boss (depth)</button><button id="clear">Clear</button>
  <span class="sep"></span>
  <button id="god">God mode</button><button id="revive">Revive</button>
  <button id="runtests">Run tests</button><button id="runsim">Balance sim</button>
</div>
<div id="wrap">
  <canvas id="cv" width="900" height="560"></canvas>
  <div id="side">
    <pre id="hud"></pre>
    <pre id="errors"></pre>
    <pre id="results">Loading…</pre>
    <pre class="info">WASD move · click = tap (move / attack / interact) · Space hold = attack · F = attack once / interact · 1-4 skills · Q/E potions</pre>
  </div>
</div>

<script>window.G = { manifest: {} };</script>
<script src="../src/core/constants.js"></script>
<script src="../src/core/events.js"></script>
<script src="../src/core/rng.js"></script>
<script src="../src/core/state.js"></script>
<script src="../src/core/scenes.js"></script>
<script>
// =====================================================================================================
// Harness-only stubs for the other teams (world / items). Deliberately crude.
// =====================================================================================================
(function () {
  'use strict';
  const G = window.G, C = G.C, T = C.TILE;
  const H = window.H = { real: /[?&]real/.test(location.search), gear: 1, arena: false, drops: 0, lastDrop: null, visCalls: 0, pathCalls: 0, errors: [], god: false };

  window.addEventListener('error', function (e) { H.errors.push((e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  const origErr = console.error;
  console.error = function () { H.errors.push(Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack.split('\n').slice(0, 2).join(' ') : String(a); }).join(' ')); origErr.apply(console, arguments); };

  function mkMap(w, h, kind, depth, theme, seed) {
    const m = { w: w, h: h, kind: kind, depth: depth, theme: theme, seed: seed, tiles: new Uint8Array(w * h).fill(T.FLOOR), explored: new Uint8Array(w * h),
      visible: new Uint8Array(w * h), spawn: { x: 4, y: h >> 1 }, rooms: [], spawns: [], props: [] };
    for (let x = 0; x < w; x++) { m.tiles[x] = T.WALL; m.tiles[(h - 1) * w + x] = T.WALL; }
    for (let y = 0; y < h; y++) { m.tiles[y * w] = T.WALL; m.tiles[y * w + w - 1] = T.WALL; }
    return m;
  }
  const set = function (m, x, y, t) { m.tiles[y * m.w + x] = t; };

  const world = G.world = {
    generateDungeon(depth, seed) {
      const m = mkMap(46, 30, 'dungeon', depth, C.themeForDepth(depth), seed);
      if (H.arena) { m.spawn = { x: 10, y: 15 }; return m; }
      for (let y = 4; y <= 11; y++) set(m, 15, y, T.WALL);
      for (let y = 18; y <= 25; y++) set(m, 15, y, T.WALL);
      for (let y = 10; y <= 12; y++) for (let x = 26; x <= 28; x++) set(m, x, y, T.WALL);
      for (let y = 20; y <= 22; y++) for (let x = 30; x <= 32; x++) set(m, x, y, T.WATER);
      set(m, 4, 15, T.STAIRS_UP); set(m, 43, 15, T.STAIRS_DOWN);
      for (let y = 26; y <= 27; y++) for (let x = 19; x <= 23; x++) set(m, x, y, T.LAVA);
      if (depth >= 2 && depth % C.BOSS_EVERY !== 0) {          // R2.5 lockdown room: walled box, one door, locked chest
        for (let x = 33; x <= 41; x++) { set(m, x, 2, T.WALL); set(m, x, 8, T.WALL); }
        for (let y = 2; y <= 8; y++) { set(m, 33, y, T.WALL); set(m, 41, y, T.WALL); }
        set(m, 37, 8, T.DOOR);
        m.rooms.push({ x: 34, y: 3, w: 7, h: 5, type: 'lockdown', doors: [{ x: 37, y: 8 }], waves: 2 });
        m.props.push({ type: 'chest', x: 37, y: 4, solid: true, interact: 'chest', locked: true });
      }
      m.props.push({ type: 'chest', x: 8, y: 5, solid: true, interact: 'chest' }, { type: 'barrel', x: 9, y: 5, solid: true, interact: 'barrel' },
        { type: 'shrine', x: 10, y: 5, solid: true, interact: 'shrine', light: 3 }, { type: 'torch', x: 6, y: 12, solid: false, light: 4 });
      if (depth % C.BOSS_EVERY === 0) {
        m.spawns.push({ x: 36, y: 15, kind: 'boss' }, { x: 22, y: 8, kind: 'pack' }, { x: 22, y: 22, kind: 'pack' });
      } else {
        m.spawns.push({ x: 20, y: 8, kind: 'pack' }, { x: 22, y: 22, kind: 'pack', count: 4 }, { x: 31, y: 6, kind: 'pack' }, { x: 36, y: 25, kind: 'pack' }, { x: 39, y: 10, kind: 'pack' },
          { x: 11, y: 22, kind: 'monster' }, { x: 19, y: 15, kind: 'monster' }, { x: 26, y: 16, kind: 'monster' }, { x: 37, y: 17, kind: 'elite' });
      }
      return m;
    },
    generateTown(seed) {
      const m = mkMap(26, 18, 'town', 0, 'town', seed);
      for (let i = 0; i < m.tiles.length; i++) if (m.tiles[i] === T.FLOOR) m.tiles[i] = T.GRASS;
      m.explored.fill(1);
      m.spawn = { x: 13, y: 13 };
      C.NPC_ROLES.forEach(function (role, i) { m.spawns.push({ x: 4 + i * 3, y: 6, kind: 'npc', role: role }); });
      m.props.push({ type: 'stash', x: 6, y: 10, solid: true, interact: 'stash' }, { type: 'dungeon_entrance', x: 20, y: 10, solid: false, interact: 'dungeon_entrance' },
        { type: 'waypoint', x: 13, y: 10, solid: false, interact: 'waypoint' });
      return m;
    },
    tileAt(map, x, y) { x = Math.floor(x); y = Math.floor(y); return (x < 0 || y < 0 || x >= map.w || y >= map.h) ? T.VOID : map.tiles[y * map.w + x]; },
    propAt(map, tx, ty) { for (const p of map.props) if (p.x === tx && p.y === ty) return p; return null; },
    isWalkable(map, x, y) {
      x = Math.floor(x); y = Math.floor(y);
      if (!C.WALKABLE[world.tileAt(map, x, y)]) return false;
      const p = world.propAt(map, x, y);
      return !(p && p.solid);
    },
    canMoveTo(map, x, y, r) {
      r = r || 0.3;
      return world.isWalkable(map, x - r, y - r) && world.isWalkable(map, x + r, y - r) && world.isWalkable(map, x - r, y + r) && world.isWalkable(map, x + r, y + r);
    },
    moveWithCollision(map, ent, dx, dy) {
      const r = Math.min(0.45, ent.radius || 0.3);
      let moved = false;
      if (dx && world.canMoveTo(map, ent.x + dx, ent.y, r)) { ent.x += dx; moved = true; }
      if (dy && world.canMoveTo(map, ent.x, ent.y + dy, r)) { ent.y += dy; moved = true; }
      return moved;
    },
    hasLineOfSight(map, x0, y0, x1, y1) {
      const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d * 10);
      for (let i = 1; i < n; i++) { const t = i / n; if (C.OPAQUE[world.tileAt(map, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)]) return false; }
      return true;
    },
    findPath(map, sx, sy, tx, ty) {          // plain BFS, 4-neighbour; avoids lava when a dry route exists (R2.1 cost stand-in)
      H.pathCalls++;
      return world._bfs(map, sx, sy, tx, ty, true) || world._bfs(map, sx, sy, tx, ty, false);
    },
    _bfs(map, sx, sy, tx, ty, dry) {
      const lava = function (x, y) { return dry && map.tiles[y * map.w + x] === T.LAVA; };
      const w = map.w, s = Math.floor(sy) * w + Math.floor(sx), g = Math.floor(ty) * w + Math.floor(tx);
      if (!world.isWalkable(map, tx, ty)) return null;
      const prev = new Int32Array(w * map.h).fill(-1), q = [s];
      prev[s] = s;
      for (let qi = 0; qi < q.length; qi++) {
        const c = q[qi];
        if (c === g) break;
        const cx = c % w, cy = (c / w) | 0;
        for (const d of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + d[0], ny = cy + d[1], n = ny * w + nx;
          if (prev[n] >= 0 || !world.isWalkable(map, nx, ny) || lava(nx, ny)) continue;
          prev[n] = c; q.push(n);
        }
      }
      if (prev[g] < 0) return null;
      const out = [];
      for (let c = g; c !== s; c = prev[c]) out.push({ x: c % w + 0.5, y: ((c / w) | 0) + 0.5 });
      out.reverse();
      // drop nodes we can see past (cheap smoothing)
      const sm = [];
      let ax = sx, ay = sy;
      for (let i = 0; i < out.length; i++) {
        if (i === out.length - 1 || !clearWalk(map, ax, ay, out[i + 1].x, out[i + 1].y, dry)) { sm.push(out[i]); ax = out[i].x; ay = out[i].y; }
      }
      return sm;
    },
    updateVisibility(map, px, py, radius) {
      H.visCalls++;
      if (H.visRadius) H.visRadius.push(radius || 9);
      radius = radius || 9;
      map.visible.fill(0);
      const x0 = Math.max(0, Math.floor(px - radius)), x1 = Math.min(map.w - 1, Math.floor(px + radius));
      const y0 = Math.max(0, Math.floor(py - radius)), y1 = Math.min(map.h - 1, Math.floor(py + radius));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (Math.hypot(x + 0.5 - px, y + 0.5 - py) > radius || !world.hasLineOfSight(map, px, py, x + 0.5, y + 0.5)) continue;
        map.visible[y * map.w + x] = 1; map.explored[y * map.w + x] = 1;
      }
    },
    invalidate(map) { H.invalidates = (H.invalidates || 0) + 1; },
    findFreeTileNear(map, x, y, maxR) {
      for (let r = 0; r <= (maxR || 6); r++) for (let oy = -r; oy <= r; oy++) for (let ox = -r; ox <= r; ox++) {
        if (Math.max(Math.abs(ox), Math.abs(oy)) === r && world.isWalkable(map, x + ox, y + oy)) return { x: Math.floor(x + ox), y: Math.floor(y + oy) };
      }
      return null;
    },
  };
  function clearWalk(map, x0, y0, x1, y1, dry) {
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d * 8);
    for (let i = 1; i <= n; i++) {
      const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      if (!world.canMoveTo(map, x, y, 0.3) || (dry && world.tileAt(map, x, y) === T.LAVA)) return false;
    }
    return true;
  }

  // Items stub. Weapon/armour follow the items team's published curves (power(l) = 3 + 1.5l + 0.02l²) at "gear level" H.gear.
  const WEAP = { warrior: ['sword', 1.4, 1.0, 0.25], ranger: ['bow', 1.3, 1.25, 0.3], sorcerer: ['staff', 1.0, 1.0, 0.3], necromancer: ['wand', 1.5, 0.7, 0.3] };
  const ARMK = { warrior: 2.2, ranger: 1.4, sorcerer: 0.9, necromancer: 0.9 };
  G.items = {
    getActiveEffects() { return H.fx || {}; },
    rollItem(o) { return { id: G.newId(), type: 'armor', name: 'Stub ' + (o.rarity || o._floor || 'item'), rarity: o.rarity || o._floor || 'common' }; },
    dropItemAt(x, y, item) { G.state.groundItems.push({ id: G.newId(), x: x, y: y, item: item }); },
    getEquipmentMods(p) {
      if (H.mods) return H.mods;
      const l = H.gear;
      if (l <= 0) return {};
      // calibrated against what the real items module hands a bot by depth 5 (see runProgression in ?real=1 mode)
      return { armor: Math.round((4 + 2.2 * l + 0.02 * l * l) * ARMK[p.classId] * (l <= 1 ? 0.5 : 1.8)), hpMax: l <= 1 ? 0 : l * 14, dmgPct: l <= 1 ? 0 : l * 3 };
    },
    getWeapon(p) {
      const WT = { bow: ['bow', 1.3, 1.25, 0.3], sword: ['sword', 1.4, 1.0, 0.25], dagger: ['dagger', 1.9, 0.9, 0.3] };
      const d = (H.wtype && WT[H.wtype]) || WEAP[p.classId], l = Math.max(1, H.gear), avg = (3 + 1.5 * l + 0.02 * l * l) * d[2] / d[1];
      const mn = Math.max(1, Math.round(avg * (1 - d[3])));
      return { dmgMin: mn, dmgMax: Math.max(mn + 1, Math.round(avg * (1 + d[3]))), attackSpeed: d[1], weaponType: d[0], twoHanded: false };
    },
    grantStarterGear(p) { p.equipment.weapon = H.gear > 0 ? { id: G.newId(), baseId: 'stub', name: 'Stub weapon', type: 'weapon', slot: 'weapon' } : null; p.potions.hp = 4; p.potions.mp = 2; },
    dropLoot(x, y, opts) {
      H.drops++; H.lastDrop = opts;
      const g = { id: G.newId(), x: x + G.rng.global.range(-0.4, 0.4), y: y + G.rng.global.range(-0.4, 0.4),
        item: { type: 'gold', qty: 3 + opts.level * 2, name: 'Gold', rarity: 'common', icon: { shape: 'gold', color: '#ffd94a' } } };
      G.state.groundItems.push(g);
      if (opts.floor) G.state.groundItems.push({ id: G.newId(), x: x, y: y, item: { id: G.newId(), type: "armor", name: "Stub floor item", rarity: opts.floor } });
      G.emit("loot:dropped", { ground: g });
    },
    pickup(id) {
      const list = G.state.groundItems, i = list.findIndex(function (g) { return g.id === id; });
      if (i < 0) return false;
      const g = list.splice(i, 1)[0], p = G.state.player;
      if (g.item.type === 'gold') { p.gold += g.item.qty; G.emit('gold:changed', { gold: p.gold, delta: g.item.qty }); G.emit('sfx', { name: 'gold' }); }
      return true;
    },
  };
})();
</script>
<script src="../src/game/manifest.js"></script>
<script>
// Load the game team's files exactly as index.html would (through the manifest), then start the harness.
// With ?real=1 the stub world/items are dropped and the real modules are loaded in front of the game module.
(function () {
  const teams = H.real ? ['world', 'items', 'game'] : ['game'];
  if (H.real) { delete G.world; delete G.items; }
  const one = function (src) {
    return new Promise(function (resolve) {
      const s = document.createElement('script');
      s.src = src; s.async = false; s.onload = resolve;
      s.onerror = function () { H.errors.push('missing ' + src); resolve(); };
      document.body.appendChild(s);
    });
  };
  let p = Promise.resolve();
  teams.forEach(function (t) { if (t !== 'game') p = p.then(function () { return one('../src/' + t + '/manifest.js'); }); });
  p.then(function () {
    let q = Promise.resolve();
    teams.forEach(function (t) { (G.manifest[t] || []).forEach(function (f) { q = q.then(function () { return one('../src/' + t + '/' + f); }); }); });
    return q;
  }).then(function () { window.startHarness(); });
})();

window.startHarness = function () {
  'use strict';
  const G = window.G, C = G.C, S = G.state, game = G.game, H = window.H;
  const $ = function (id) { return document.getElementById(id); };
  const cv = $('cv'), ctx = cv.getContext('2d');
  const TS = 18;                       // pixels per tile (top-down debug view)
  const fxList = [], texts = [];
  const seen = { fx: {}, sfx: {}, badFx: [], badSfx: [], badShape: [] };
  const SFX = 'hit swing cast fire ice bolt arrow hurt die loot loot_rare loot_legendary gold levelup equip potion click error door stairs quest buy sell chest shrine'.split(' ');
  let simulating = false;

  G.on('fx:spawn', function (e) {
    seen.fx[e.type] = 1;
    if (C.FX_TYPES.indexOf(e.type) < 0) seen.badFx.push(e.type);
    if (!simulating) fxList.push({ type: e.type, x: e.x, y: e.y, color: e.color || '#ffffff', r: e.radius || 0.6, d: e.duration || 0.35, t: 0 });
  });
  G.on('fx:text', function (e) { if (!simulating) texts.push({ x: e.x, y: e.y, text: e.text, color: e.color || '#fff', crit: e.crit, t: 0 }); });
  G.on('sfx', function (e) { seen.sfx[e.name] = 1; if (SFX.indexOf(e.name) < 0) seen.badSfx.push(e.name); });
  let lastToast = '';
  G.on('ui:toast', function (e) { lastToast = e.text; });
  G.on('player:died', function () { lastToast = 'YOU DIED — press Revive'; });

  // ---------------- controls ----------------
  const monSel = $('mon');
  Object.keys(game.MONSTERS).forEach(function (id) {
    const o = document.createElement('option');
    o.value = id; o.textContent = game.MONSTERS[id].theme + ' · ' + game.MONSTERS[id].n;
    monSel.appendChild(o);
  });
  function newGame(classId) { G.scenes.startNewGame(classId, 'Tester'); G.scenes.enterDungeon(+$('depth').value || 1); }
  document.querySelectorAll('[data-class]').forEach(function (b) { b.onclick = function () { H.arena = false; newGame(b.dataset.class); }; });
  document.querySelectorAll('[data-mode]').forEach(function (b) { b.onclick = function () { game.setAutoBuild(b.dataset.mode || null); }; });
  $('respec').onclick = function () { S.player.gold += game.getRespecCost(); game.respec(); };
  function levelUp(n) { for (let i = 0; i < n; i++) if (S.player.level < 60) game.gainXp(Math.ceil((S.player.xpNext - S.player.xp) / (1 + S.player.stats.xpGain / 100))); }
  $('lvl1').onclick = function () { levelUp(1); };
  $('lvl5').onclick = function () { levelUp(5); };
  $('gear').onchange = function () { H.gear = +$('gear').value; G.items.grantStarterGear(S.player); game.recomputeStats(S.player); };
  $('dungeon').onclick = function () { H.arena = false; G.scenes.enterDungeon(+$('depth').value || 1); };
  $('arena').onclick = function () { H.arena = true; G.scenes.enterDungeon(+$('depth').value || 1); H.arena = false; };
  $('town').onclick = function () { G.scenes.enterTown(); };
  function spawnNear(id, rarity) {
    const p = S.player, a = Math.random() * 6.28;
    const e = game.createMonster(id, p.x + Math.cos(a) * 5, p.y + Math.sin(a) * 5, +$('depth').value || 1, rarity);
    const spot = G.world.findFreeTileNear(S.map, e.x, e.y, 6);
    if (spot) { e.x = spot.x + 0.5; e.y = spot.y + 0.5; }
    S.entities.push(e);
    return e;
  }
  $('spawn').onclick = function () { spawnNear(monSel.value, $('rar').value); };
  $('pack').onclick = function () { for (let i = 0; i < 5; i++) spawnNear(monSel.value, 'normal'); };
  $('boss').onclick = function () { const p = S.player; S.entities.push(game.createBoss(+$('depth').value || 5, Math.min(S.map.w - 3, p.x + 7), p.y)); };
  $('clear').onclick = function () { S.entities = S.entities.filter(function (e) { return e.type !== 'monster' || e.faction === 'player'; }); S.projectiles.length = 0; game.zones.length = 0; };
  $('god').onclick = function () { H.god = !H.god; $('god').textContent = H.god ? 'God mode ON' : 'God mode'; };
  $('revive').onclick = function () { game.revivePlayer(); };
  $('runtests').onclick = function () { runTests(); };
  $('runsim').onclick = function () { runSim(); };

  const keys = {};
  function syncMove() {
    G.input.move.x = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    G.input.move.y = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
  }
  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if ('wasd'.indexOf(k) >= 0 && k.length === 1) { keys[k] = true; syncMove(); }
    else if (k >= '1' && k <= '4') G.emit('input:skill', { slot: +k - 1 });
    else if (k === 'q') G.emit('input:potion', { kind: 'hp' });
    else if (k === 'e') G.emit('input:potion', { kind: 'mp' });
    else if (k === 'f') G.emit('input:attack', {});
    else if (k === ' ') { G.input.attackHeld = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {

  // =====================================================================================================
  // Balance bot: plays with hold-attack + skills off cooldown + potions, sidesteps telegraphs, ranged classes back off.
  // =====================================================================================================
  function botStep(st) {
    const p = S.player;
    if (p.dead) return;
    const ranged = p.bonus.w.ranged;
    let near = null, nd = 1e9, best = 1e9;
    for (const e of S.entities) {
      if (e.type !== "monster" || e.dead || e.faction !== "enemy") continue;
      if (S.flags.sealed && !e.lockdown) continue;                       // locked in: only the waves matter
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      const score = d - (d < 12 && game.W.visible(e.x, e.y) ? 100 : 0) - (e.id === st.tid ? 30 : 0);      // what we can see comes first; otherwise stick with the current quarry
      if (score < best) { best = score; nd = d; near = e; }
    }
    st.tid = near ? near.id : 0;
    let mx = 0, my = 0;
    // 1. get out of telegraphed circles
    for (const z of game.zones) {
      if (z.faction !== 'enemy') continue;
      const d = Math.hypot(p.x - z.x, p.y - z.y);
      if (d < z.r + 0.6) { const k = d || 1; mx += (p.x - z.x) / k || 1; my += (p.y - z.y) / k; }
    }
    const fighting = near && nd < (ranged ? 7.8 : 6.5) && game.W.visible(near.x, near.y);
    if (!mx && !my) {
      if (fighting) {
        if (ranged && nd < 3 && near.rarity !== "boss" && game.W.shotClear(p.x, p.y, near.x, near.y)) { mx = (p.x - near.x) / nd; my = (p.y - near.y) / nd; }      // kite
        else if (ranged && nd < 3.5 && near.rarity === 'boss') { mx = (p.x - near.x) / nd; my = (p.y - near.y) / nd; }
      } else if (near) {
        st.pt -= 1 / 30;
        if (st.pt <= 0 || !st.path) { st.path = G.world.findPath(S.map, p.x, p.y, near.x, near.y) || [{ x: near.x, y: near.y }]; st.pt = 0.5; }
        const n = st.path[0];
        if (n) { const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < 0.3) st.path.shift(); else { mx = (n.x - p.x) / d; my = (n.y - p.y) / d; } }
      }
    }
    const mag = Math.hypot(mx, my);
    G.input.move.x = mag ? mx / mag : 0; G.input.move.y = mag ? my / mag : 0;
    const ca = game.getClassAction();          // R4.4: dash out of melee range or out of a telegraph
    if (ca && (ca.ready !== undefined ? ca.ready : ca.cdRemaining <= 0) && near && (nd < 2.2 || (mag && game.zones.some(function (z) { return z.faction === "enemy" && z.delay > 0 && Math.hypot(p.x - z.x, p.y - z.y) < z.r + 0.4; })))) { G.emit("input:classaction", {}); st.dashes = (st.dashes || 0) + 1; }
    G.input.attackHeld = !!fighting;
    st.t -= 1 / 30;
    if (fighting && st.t <= 0) {
      st.t = 0.2;
      for (let i = 0; i < 4; i++) {
        const id = p.skillBar[(i + st.rot) % 4];
        if (!id || (p.cooldowns[id] || 0) > 0) continue;
        const sk = game.SKILLS[id];
        if (sk.tags.indexOf('summon') >= 0 && p.minions[id] >= 1 && S.entities.filter(function (e) { return e.summonOf === id && !e.dead; }).length >= p.minions[id]) continue;
        if ((sk.tg === 'self' && sk.tags.indexOf('aoe') >= 0 && !sk.tags.includes('summon')) && nd > 3) continue;
        if (sk.tags.indexOf('mobility') >= 0 && sk.tags.indexOf('single') < 0 && sk.tags.indexOf('aoe') < 0) continue;
        if (game.useSkill((i + st.rot) % 4)) { st.rot++; break; }
      }
    }
    if (p.hp < p.stats.hpMax * 0.45 && game.usePotion('hp')) { st.potions++; st.hpPots = (st.hpPots || 0) + 1; }
    if (p.mp < p.stats.mpMax * 0.15 && game.usePotion('mp')) st.potions++;
    st.minHp = Math.min(st.minHp, p.hp / p.stats.hpMax);
  }

  function simRun(classId, mode, opts) {
    H.gear = opts.gear;
    G.input.move.x = 0; G.input.move.y = 0; G.input.attackHeld = false;
    G.scenes.startNewGame(classId, 'Bot');
    game.setAutoBuild(mode);
    while (S.player.level < opts.level) game.gainXp(S.player.xpNext);
    H.arena = !!opts.boss;
    G.scenes.enterDungeon(opts.depth);
    H.arena = false;
    const p0 = S.player;
    p0.potions.hp = opts.potions; p0.potions.mp = 3;
    p0.hp = p0.stats.hpMax; p0.mp = p0.stats.mpMax;
    if (opts.boss) S.entities.push(game.createBoss(opts.depth, p0.x + 9, p0.y));
    const st = { t: 0, rot: 0, potions: 0, minHp: 1, pt: 0, path: null };
    let t = 0;
    const dt = 1 / 30, limit = opts.limit || 400;
    const alive = function () { return S.entities.some(function (e) { return e.type === 'monster' && e.faction === 'enemy' && !e.dead && !e.bossAdd; }); };
    while (t < limit && !S.player.dead && alive()) { botStep(st); S.time += dt; game.update(dt); t += dt; }
    G.input.move.x = 0; G.input.move.y = 0; G.input.attackHeld = false;
    return { win: !S.player.dead && !alive(), dead: S.player.dead, time: t, minHp: st.minHp, potions: st.potions, level: S.player.level, hp: S.player.hp / S.player.stats.hpMax };
  }

  function runSim() {
    simulating = true;
    const lines = ['\nBALANCE SIM (bot: hold attack, skills off cooldown, potion < 45% hp, sidesteps telegraphs)\n'];
    const pad = function (s, n) { s = String(s); return s + ' '.repeat(Math.max(1, n - s.length)); };
    const res = { depth1: {}, boss: {} };
    lines.push('Depth 1 full clear — fresh level-1 character, starter gear, 4 hp potions (≈30 monsters incl. a champion pack)');
    lines.push(pad('class/mode', 24) + pad('result', 8) + pad('time', 8) + pad('min hp', 9) + pad('potions', 9) + 'end lvl');
    for (const cid of Object.keys(game.CLASSES)) for (const mode of ['single', 'aoe', 'balanced']) {
      let wins = 0, time = 0, minHp = 1, pots = 0, lvl = 0, deaths = 0;
      const N = 4;
      for (let i = 0; i < N; i++) { const r = simRun(cid, mode, { depth: 1, level: 1, gear: 1, potions: 4 }); wins += r.win ? 1 : 0; deaths += r.dead ? 1 : 0; time += r.time; minHp = Math.min(minHp, r.minHp); pots += r.potions; lvl = r.level; }
      res.depth1[cid + '/' + mode] = { wins: wins, n: N, time: time / N, minHp: minHp, potions: pots / N };
      lines.push(pad(cid + '/' + mode, 24) + pad(wins + '/' + N, 8) + pad((time / N).toFixed(0) + 's', 8) + pad(Math.round(minHp * 100) + '%', 9) + pad((pots / N).toFixed(1), 9) + pad(lvl, 8) + (deaths ? deaths + " died" : "") + (N - wins - deaths ? (N - wins - deaths) + " timed out" : ""));
    }
    lines.push('\nDepth 5 boss (Morgrath, level 7) — level-7 character, 6 hp potions. UNDER-GEARED stress case: stub weapon + armour only, no affixes (real-drop results: runProgression in ?real=1 mode)');
    lines.push(pad('class/mode', 24) + pad('result', 8) + pad('time', 8) + pad('min hp', 9) + pad('potions', 9) + 'hp left');
    for (const cid of Object.keys(game.CLASSES)) for (const mode of ['single', 'aoe', 'balanced']) {
      let wins = 0, time = 0, minHp = 1, pots = 0, hp = 0;
      const N = 5;
      for (let i = 0; i < N; i++) { const r = simRun(cid, mode, { depth: 5, level: 7, gear: 5, potions: 6, boss: true, limit: 300 }); wins += r.win ? 1 : 0; time += r.time; minHp = Math.min(minHp, r.minHp); pots += r.potions; hp += r.hp; }
      res.boss[cid + '/' + mode] = { wins: wins, n: N, time: time / N, minHp: minHp, potions: pots / N };
      lines.push(pad(cid + '/' + mode, 24) + pad(wins + '/' + N, 8) + pad((time / N).toFixed(0) + 's', 8) + pad(Math.round(minHp * 100) + '%', 9) + pad((pots / N).toFixed(1), 9) + Math.round(hp / N * 100) + '%');
    }
    simulating = false;
    window.__sim = { text: lines.join('\n'), res: res };
    log('info', lines.join('\n'));
    flush();
    H.gear = +$('gear').value;
    fresh('warrior', false, +$('depth').value || 1);
    return window.__sim;
  }
  // =====================================================================================================
  // Integration mode (tests/combat.html?real=1): the REAL world + items modules instead of the stubs.
  // runProgression plays auto-build characters floor by floor with a bot that fights, drinks, loots,
  // equips upgrades (G.items.isUpgrade), sells the rest and buys potions — gear is whatever really dropped.
  // =====================================================================================================
  function lootAndGear(st) {
    const p = S.player, I = G.items;
    for (let i = S.groundItems.length - 1; i >= 0; i--) {
      const g = S.groundItems[i];
      if (g && Math.hypot(g.x - p.x, g.y - p.y) < 14) { try { I.pickup(g.id); } catch (e) { H.errors.push('pickup ' + e); } }
    }
    for (let i = 0; i < p.inventory.length; i++) {
      const it = p.inventory[i];
      if (!it) continue;
      try {
        if (it.slot && I.isUpgrade(it) && I.equip(i)) { st.equips++; continue; }
      } catch (e) { H.errors.push('equip ' + e); }
    }
    for (let i = 0; i < p.inventory.length; i++) {          // vendor trip stand-in: everything left is sold
      const it = p.inventory[i];
      if (!it) continue;
      p.gold += Math.max(1, it.value | 0) * (it.qty || 1);
      p.inventory[i] = null;
    }
  }

  function shop() {
    const p = S.player, I = G.items;
    for (let k = 0; k < 20 && p.potions.hp < 6; k++) { const pr = I.potionPrice('hp'); if (p.gold < pr) break; p.gold -= pr; p.potions.hp++; }
    for (let k = 0; k < 20 && p.potions.mp < 3; k++) { const pr = I.potionPrice('mp'); if (p.gold < pr) break; p.gold -= pr; p.potions.mp++; }
  }

  function gearSummary(p) {
    const w = p.bonus.w;
    return Math.round((w.min + w.max) / 2 * w.aps * 10) / 10 + 'dps ' + w.type + ', armor ' + p.stats.armor + ', hp ' + p.stats.hpMax;
  }

  async function runProgression(opts) {
    opts = opts || {};
    const classes = opts.classes || Object.keys(game.CLASSES), mode = opts.mode || 'balanced', maxDepth = opts.maxDepth || 20;
    const dt = 1 / 30, rows = [];
    simulating = true;
    for (const cid of classes) {
      G.input.move.x = 0; G.input.move.y = 0; G.input.attackHeld = false;
      G.scenes.startNewGame(cid, 'Bot');
      game.setAutoBuild(mode);
      let totalDeaths = 0;
      for (let depth = opts.startDepth || 1; depth <= maxDepth; depth++) {
        shop();
        // opts.pallorFrom: Pallor unlocks at that depth and every later floor counts as taken by the stairs (the
        // between-floor shop() is a stand-in, not a town visit); a death resets it, as respawning in town would.
        if (opts.pallorFrom && depth >= opts.pallorFrom) { S.flags.pallorUnlocked = true; if (depth > opts.pallorFrom) game.pallorStairs = 'stairs_down'; }
        G.scenes.enterDungeon(depth);
        const pallor0 = game.getPallor().value;
        const st = { t: 0, rot: 0, potions: 0, minHp: 1, pt: 0, path: null, equips: 0, lastX: 0, lastY: 0, stuckT: 0, unstuck: 0 };
        const total = S.entities.filter(function (e) { return e.type === 'monster' && e.faction === 'enemy'; }).length;
        let t = 0, deaths = 0, bossT0 = -1, bossTime = -1, bossDeaths = 0, n = 0, lvl0 = S.player.level;
        const left = function () { let c = 0; for (const e of S.entities) if (e.type === 'monster' && e.faction === 'enemy' && !e.dead && !e.bossAdd) c++; return c; };
        const cap = opts.floorCap || 480;
        while (t < cap && left() > 0 && deaths < 6) {
          const p = S.player;
          if (p.dead) {
            deaths++; totalDeaths++;
            if (bossT0 >= 0 && bossTime < 0) bossDeaths++;
            if (S.flags.pallorUnlocked) S.flags.pallor = 0;
            game.revivePlayer(); shop();
            p.potions.hp = Math.max(p.potions.hp, 3);          // a town trip always nets a few potions
            // back to the stairs, monsters reset (as a real corpse run would find them)
            p.x = S.map.spawn.x + 0.5; p.y = S.map.spawn.y + 0.5; game.onPlayerMoved(true);
            for (const e of S.entities) if (e.type === 'monster' && e.faction === 'enemy' && !e.dead) { e.hp = e.stats.hpMax; e.ai.st = 'sleep'; e.effects = []; e.ai.cast = null; }
            game.zones.length = 0; S.projectiles.length = 0; bossT0 = -1;
            continue;
          }
          botStep(st);
          S.time += dt; game.update(dt); t += dt; n++;
          const boss = bossT0 < 0 || bossTime < 0 ? S.entities.find(function (e) { return e.rarity === 'boss'; }) : null;
          if (boss) {
            if (bossT0 < 0 && !boss.dead && boss.ai.st !== "sleep") { bossT0 = t; st.bossPots = st.potions; st.bossHp = st.hpPots || 0; st.minHp = 1; }
            if (bossT0 >= 0 && boss.dead && bossTime < 0) { bossTime = t - bossT0; st.bossMin = st.minHp; st.bossPots = st.potions - st.bossPots; st.bossHp = (st.hpPots || 0) - st.bossHp; }
          }
          if (n % 45 === 0) {
            lootAndGear(st);
            // unstick: the bot is not a pathing test — if it makes no progress for 8 s, drop it next to the nearest enemy
            let hpSum = 0; for (const e of S.entities) if (e.type === "monster" && e.faction === "enemy" && !e.dead) hpSum += e.hp;
            if (Math.hypot(p.x - st.lastX, p.y - st.lastY) < 0.5 && hpSum === st.hpSum) st.stuckT += 1.5; else st.stuckT = 0;
            st.hpSum = hpSum;
            st.lastX = p.x; st.lastY = p.y;
            if (st.stuckT >= 8 && !S.flags.sealed) {
              st.stuckT = 0; st.unstuck++;
              let near = null, nd = 1e9;
              for (const e of S.entities) { if (e.type !== 'monster' || e.dead || e.faction !== 'enemy') continue; const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < nd) { nd = d; near = e; } }
              if (near) { const spot = G.world.findFreeTileNear(S.map, Math.floor(near.x) + 3, Math.floor(near.y), 4); if (spot) { p.x = spot.x + 0.5; p.y = spot.y + 0.5; game.onPlayerMoved(true); } }
            }
          }
          if (n % 2400 === 0) await new Promise(function (r) { setTimeout(r, 0); });
        }
        lootAndGear(st);
        const p = S.player;
        const row = { cls: cid, mode: mode, depth: depth, theme: S.map.theme, monsters: total, left: left(), time: Math.round(t), deaths: deaths, potions: st.potions, minHp: Math.round(st.minHp * 100),
          level: p.level, gained: p.level - lvl0, boss: bossTime >= 0 ? Math.round(bossTime) : (depth % C.BOSS_EVERY === 0 ? 'not killed' : ''), bossDeaths: bossDeaths, bossMin: st.bossMin !== undefined ? Math.round(st.bossMin * 100) : "", bossPots: bossTime >= 0 ? st.bossPots : "", bossHpPots: bossTime >= 0 ? st.bossHp : "", equips: st.equips, unstuck: st.unstuck, gear: gearSummary(p), gold: p.gold, pallor: pallor0, mods: (S.map.mods || []).join('+') };
        rows.push(row);
        if (opts.onRow) opts.onRow(row);
        window.__prog = { rows: rows, done: false, errors: H.errors.slice() };
        if (deaths >= 6) break;          // a wall: stop this class here
        await new Promise(function (r) { setTimeout(r, 0); });
      }
    }
    simulating = false;
    G.input.move.x = 0; G.input.move.y = 0; G.input.attackHeld = false;
    window.__prog = { rows: rows, done: true, errors: H.errors.slice() };
    return rows;
  }
  window.runProgression = runProgression; window.botStep = botStep;

  // Every class × auto-build mode, `reps` times. Progress and result in window.__matrix ({ done, rows, text }).
  // runMatrix({ reps: 4, maxDepth: 20 })  ·  runMatrix({ reps: 3, maxDepth: 30, pallorFrom: 21 })
  async function runMatrix(opts) {
    opts = opts || {};
    const reps = opts.reps || 3, classes = opts.classes || Object.keys(game.CLASSES), modes = opts.modes || ['single', 'aoe', 'balanced'], all = [];
    window.__matrix = { done: false, rows: all, text: '' };
    for (let rep = 0; rep < reps; rep++) for (const mode of modes) for (const cls of classes) {
      const rows = await runProgression({ classes: [cls], mode: mode, maxDepth: opts.maxDepth || 20, pallorFrom: opts.pallorFrom });
      rows.forEach(function (r) { r.rep = rep; all.push(r); });
    }
    window.__matrix = { done: true, rows: all, text: matrixTable(all, classes, modes), errors: H.errors.slice() };
    return window.__matrix;
  }
  function matrixTable(A, classes, modes) {
    const avg = function (a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : NaN; };
    const f1 = function (v) { return isNaN(v) ? '-' : v.toFixed(1); };
    const isNum = function (v) { return typeof v === 'number'; };
    const out = ['Bosses at depth 5/10/15/20 — potions per boss kill (avg, hp+mana), of which hp, per depth, boss-fight deaths, bosses not killed, floor deaths 1–20, level at 20',
      'class/mode            pots  hp    5/10/15/20            bossDeaths  unkilled  deaths  lvl20'];
    const pad = function (s, n) { s = String(s); return s + ' '.repeat(Math.max(1, n - s.length)); };
    const cls = {};
    for (const c of classes) for (const m of modes) {
      const R = A.filter(function (r) { return r.cls === c && r.mode === m; });
      const B = R.filter(function (r) { return r.depth <= 20 && r.depth % 5 === 0; }), K = B.filter(function (r) { return isNum(r.boss); });
      const pots = K.map(function (r) { return r.bossPots; });
      (cls[c] = cls[c] || []).push.apply(cls[c], pots);
      (cls[c + '_hp'] = cls[c + '_hp'] || []).push.apply(cls[c + '_hp'], K.map(function (r) { return r.bossHpPots; }));
      out.push(pad(c + '/' + m, 22) + pad(f1(avg(pots)), 6) + pad(f1(avg(K.map(function (r) { return r.bossHpPots; }))), 6) + pad([5, 10, 15, 20].map(function (d) { return f1(avg(K.filter(function (r) { return r.depth === d; }).map(function (r) { return r.bossPots; }))); }).join('/'), 22) +
        pad(B.reduce(function (s, r) { return s + r.bossDeaths; }, 0), 12) + pad(B.length - K.length, 10) + pad(R.filter(function (r) { return r.depth <= 20; }).reduce(function (s, r) { return s + r.deaths; }, 0), 8) +
        f1(avg(R.filter(function (r) { return r.depth === 20; }).map(function (r) { return r.level; }))));
    }
    out.push('class average potions per boss: ' + classes.map(function (c) { return c + ' ' + f1(avg(cls[c])) + ' (hp ' + f1(avg(cls[c + '_hp'])) + ')'; }).join(', '));
    if (A.some(function (r) { return r.depth > 20; })) {
      out.push('', 'Depths 21+ — deaths, potions per floor, highest Pallor, boss 25 and 30 (potions / boss-fight deaths), level at 30, deepest floor per rep',
        'class/mode            deaths  pots/floor  pallor  boss25      boss30      lvl30  reached');
      for (const c of classes) for (const m of modes) {
        const R = A.filter(function (r) { return r.cls === c && r.mode === m && r.depth > 20; });
        const b = function (d) { const X = R.filter(function (r) { return r.depth === d; }); return f1(avg(X.filter(function (r) { return isNum(r.bossPots); }).map(function (r) { return r.bossPots; }))) + '/' + X.reduce(function (s, r) { return s + r.bossDeaths; }, 0); };
        const reps = []; A.forEach(function (r) { if (r.cls === c && r.mode === m) reps[r.rep] = Math.max(reps[r.rep] || 0, r.depth); });
        out.push(pad(c + '/' + m, 22) + pad(R.reduce(function (s, r) { return s + r.deaths; }, 0), 8) + pad(f1(avg(R.map(function (r) { return r.potions; }))), 12) + pad(Math.max.apply(null, [0].concat(R.map(function (r) { return r.pallor; }))), 8) +
          pad(b(25), 12) + pad(b(30), 12) + pad(f1(avg(A.filter(function (r) { return r.cls === c && r.mode === m && r.depth === 30; }).map(function (r) { return r.level; }))), 7) + reps.join(','));
      }
    }
    return out.join('\n');
  }
  window.runMatrix = runMatrix; window.matrixTable = matrixTable;

  // =====================================================================================================
  // Difficulty probe (?real=1): per depth band, a balanced auto-build character at the expected level wearing REAL items
  // rolled at its level (best of 4 per slot, no uniques): hits-to-kill normal/champion/rare monsters with the basic attack and
  // the main skill, and seconds to die standing still in a melee pack (5) and a ranged group (4). runDifficulty() → __diff.text
  // =====================================================================================================
  function gearUp(p, lvl, rng) {
    const I = G.items, wt = game.CLASSES[p.classId].weaponTypes;
    for (const slot of ['weapon', 'helm', 'chest', 'gloves', 'boots', 'belt', 'amulet', 'ring', 'ring', 'offhand']) {
      let best = null;
      for (let k = 0, n = 0; k < 60 && n < 4; k++) {
        const it = I.rollItem({ level: lvl, slot: slot, rng: rng });
        if (!it || (it.rarity !== 'common' && it.rarity !== 'uncommon' && it.rarity !== 'rare')) continue;
        if (slot === 'weapon' && (wt.indexOf(it.weaponType) < 0 || (p.classId !== 'warrior' && it.twoHanded && it.weaponType !== 'staff' && it.weaponType !== 'bow'))) continue;
        if (slot === 'offhand' && p.equipment.weapon && p.equipment.weapon.twoHanded) break;
        n++;
        if (!best || (it.value | 0) > (best.value | 0)) best = it;
      }
      if (!best) continue;
      best.reqLevel = 1;
      const i = p.inventory.indexOf(null); p.inventory[i] = best;
      try { I.equip(i, slot === 'ring' ? (p.equipment.ring1 ? 'ring2' : 'ring1') : undefined); } catch (e) { H.errors.push('equip ' + e); }
      if (p.inventory[i] === best) p.inventory[i] = null;
    }
    game.recomputeStats(p);
  }
  function diffChar(cls, lvl, rng) {
    G.scenes.startNewGame(cls, 'Probe');
    for (const s of C.EQUIP_SLOTS) S.player.equipment[s] = null;
    game.setAutoBuild('balanced');
    while (S.player.level < lvl) game.gainXp(S.player.xpNext);
    gearUp(S.player, lvl, rng);
    return S.player;
  }
  function mainSkill(p) {
    for (const id of p.skillBar) { const sk = id && game.SKILLS[id]; if (sk && sk.v && sk.v.dmg && sk.tags.indexOf('summon') < 0) return sk; }
    return null;
  }
  function hitsToKill(p, e, spec, n) {
    let tot = 0;
    for (let i = 0; i < n; i++) { e.dead = false; e.hp = 1e9; e.effects = []; tot += game.playerHit(e, spec); }
    e.hp = e.stats.hpMax; e.dead = false; e.effects = [];
    const avg = tot / n;
    return avg > 0 ? e.stats.hpMax / avg : Infinity;
  }
  function standStill(p, ids, depth) {
    S.entities = S.entities.filter(function (e) { return e.type !== 'monster'; }); S.projectiles.length = 0; game.zones.length = 0;
    p.effects = []; game.recomputeStats(p); p.hp = p.stats.hpMax; p.dead = false;
    const spot = G.world.findFreeTileNear(S.map, S.map.spawn.x, S.map.spawn.y, 2) || S.map.spawn;
    p.x = spot.x + 0.5; p.y = spot.y + 0.5; game.onPlayerMoved(true);
    ids.forEach(function (id, i) {
      const a = i / ids.length * 6.28, r = game.MONSTERS[id].atk === 'melee' ? 1.2 : 5;
      const at = game.W.free(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 3) || { x: p.x + 1, y: p.y };
      const e = game.createMonster(id, at.x, at.y, game.monsterLevel ? game.monsterLevel(depth) : depth, 'normal'); e.ai.st = 'chase'; S.entities.push(e);
    });
    G.input.move.x = G.input.move.y = 0; G.input.attackHeld = false;
    let t = 0;
    while (t < 60 && !p.dead) { S.time += 1 / 30; game.update(1 / 30); t += 1 / 30; }
    return p.dead ? t : 60;
  }
  function runDifficulty(opts) {
    opts = opts || {};
    simulating = true;
    const depths = opts.depths || [1, 2, 3, 5, 8, 10, 15, 20, 25, 30], classes = opts.classes || Object.keys(game.CLASSES), reps = opts.reps || 3;
    const lvlFor = opts.lvlFor || function (d) { return Math.min(60, Math.round(d * 1.15 + 1)); };
    const pad = function (s, n) { s = String(s); return s + ' '.repeat(Math.max(1, n - s.length)); };
    const f1 = function (v) { return !isFinite(v) ? '∞' : v < 10 ? v.toFixed(1) : String(Math.round(v)); };
    const lines = ['Hits to kill (basic attack / main skill) and seconds to die standing still — balanced auto-build at the expected level, real items (best of 4 rolls per slot, common–uncommon–rare)',
      pad('depth', 7) + pad('lvl', 5) + pad('class', 13) + pad('normal', 12) + pad('champion', 12) + pad('rare', 12) + pad('pack(5)', 9) + pad('ranged(4)', 10) + 'hp / weapon dps'];
    const rows = [];
    for (const d of depths) {
      const lvl = lvlFor(d);
      for (const cls of classes) {
        const acc = { n: [0, 0], c: [0, 0], r: [0, 0], pack: 0, rng: 0 };
        let p = null;
        for (let rep = 0; rep < reps; rep++) {
          const rng = G.rng.create(1000 + d * 31 + rep * 7);
          p = diffChar(cls, lvl, rng);
          G.scenes.enterDungeon(d);
          S.entities = S.entities.filter(function (e) { return e.type !== 'monster'; });
          const theme = C.themeForDepth(d), pool = game.THEME_POOLS[theme];
          const melee = pool.filter(function (id) { return game.MONSTERS[id].atk === 'melee' && game.MONSTERS[id].arch !== 'swarm'; });
          const ranged = pool.filter(function (id) { return game.MONSTERS[id].atk !== 'melee'; });
          const sk = mainSkill(p);
          const basic = { pct: p.bonus.w.ranged ? 100 : 120, type: 'phys', skill: false, melee: !p.bonus.w.ranged };
          const skill = sk ? { pct: game.applySynergies(p, sk, game.skillValues(sk, game.skillRank(p, sk.id))).dmg, type: sk.id.indexOf('fire') >= 0 ? 'fire' : sk.id.indexOf('ice') >= 0 || sk.id.indexOf('frost') >= 0 ? 'cold' : 'phys' } : basic;
          const L = game.monsterLevel ? game.monsterLevel(d) : d;
          const tiers = [['n', 'normal', 0], ['c', 'champion', 1], ['r', 'rare', 2]];
          for (const tr of tiers) {
            let hb = 0, hs = 0;
            for (const id of melee) {
              const e = game.createMonster(id, p.x + 2, p.y, L + tr[2], tr[1], null, tr[1] === 'normal' ? undefined : 'Extra Strong');
              e.ai.st = 'sleep'; S.entities.push(e); game.live.foes.push(e);
              hb += hitsToKill(p, e, basic, 60); hs += hitsToKill(p, e, skill, 60);
              S.entities.pop(); game.live.foes.pop();
            }
            acc[tr[0]][0] += hb / melee.length / reps; acc[tr[0]][1] += hs / melee.length / reps;
          }
          acc.pack += standStill(p, [0, 1, 2, 3, 4].map(function (i) { return melee[i % melee.length]; }), d) / reps;
          acc.rng += standStill(p, [0, 1, 2, 3].map(function (i) { return ranged[i % ranged.length]; }), d) / reps;
        }
        const w = p.bonus.w;
        rows.push({ depth: d, level: lvl, cls: cls, normal: acc.n, champion: acc.c, rare: acc.r, pack: acc.pack, ranged: acc.rng });
        lines.push(pad(d, 7) + pad(lvl, 5) + pad(cls, 13) + pad(f1(acc.n[0]) + ' / ' + f1(acc.n[1]), 12) + pad(f1(acc.c[0]) + ' / ' + f1(acc.c[1]), 12) + pad(f1(acc.r[0]) + ' / ' + f1(acc.r[1]), 12) +
          pad(f1(acc.pack) + 's', 9) + pad(f1(acc.rng) + 's', 10) + p.stats.hpMax + ' / ' + Math.round((w.min + w.max) / 2 * w.aps));
      }
    }
    simulating = false;
    window.__diff = { rows: rows, text: lines.join('\n') };
    return window.__diff;
  }
  window.runDifficulty = runDifficulty;

  window.runTests = runTests; window.runSim = runSim; window.simRun = simRun;

  // ---------------- go ----------------
  if (H.real) {
    $('results').textContent = 'Integration mode: real world + items modules. The scripted assertions need the stub map — open without ?real=1.\nRun runProgression({ classes, mode, maxDepth }) from the console (results in window.__prog).';
    G.scenes.startNewGame('warrior', 'Tester'); G.scenes.enterDungeon(1);
  } else {
    try { runTests(); } catch (err) { console.error(err); $('results').textContent = 'Harness failed: ' + err; }
  }
  requestAnimationFrame(frame);
};
</script>
