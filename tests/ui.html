<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<link rel="manifest" href="../manifest.webmanifest">
<title>Sallow — UI harness</title>
<style>
  /* same base rules as index.html */
  html, body { margin: 0; height: 100%; background: #0b0a0f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot-error { position: fixed; left: 8px; bottom: 8px; right: 8px; color: #f66; font: 11px monospace; white-space: pre-wrap; pointer-events: none; z-index: 9999; }
  /* harness-only dev drawer */
  #dev-toggle { position: fixed; left: 0; bottom: 0; z-index: 9000; font: 10px monospace; background: #204020; color: #afa; border: 1px solid #5a5; padding: 6px 3px; }
  #dev { position: fixed; left: 0; top: 0; bottom: 0; width: 190px; z-index: 9001; background: #0c140cf0; border-right: 1px solid #5a5; overflow-y: auto;
    touch-action: pan-y; font: 10px monospace; color: #afa; padding: 4px; display: none; }
  #dev button { font: 10px monospace; margin: 1px; padding: 5px 4px; background: #183018; color: #cfc; border: 1px solid #5a5; }
  #dev h4 { margin: 6px 0 2px; font-size: 10px; color: #7c7; }
  #dev pre { margin: 4px 0; white-space: pre-wrap; color: #9c9; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot-error"></div>
<button id="dev-toggle" type="button">DEV</button>
<div id="dev"></div>
<script>
// UI-team harness. Default: core + the stubs below + src/ui. With ?real=1 it loads every team's real manifest instead.
window.G = { manifest: {} };
window.__errors = [];
(function () {
  var errBox = document.getElementById('boot-error');
  window.addEventListener('error', function (e) {
    window.__errors.push(e.message);
    errBox.textContent += (e.message || 'error') + ' @ ' + (e.filename || '').split('/').slice(-2).join('/') + ':' + e.lineno + '\n';
  });
  var origErr = console.error;
  console.error = function () { window.__errors.push([].slice.call(arguments).join(' ')); origErr.apply(console, arguments); };

  // core/main.js registers 'sw.js' relative to the page; from /tests/ that must point at the real worker in the root.
  if (navigator.serviceWorker) {
    var swRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
    navigator.serviceWorker.register = function (url, opts) { return swRegister(url === 'sw.js' ? '../sw.js' : url, opts); };
  }

  var REAL = /[?&]real=1/.test(location.search);
  var ROOT = '../';
  var TEAMS = REAL ? ['engine', 'world', 'items', 'game', 'ui'] : ['ui'];
  var CORE = ['constants.js', 'events.js', 'rng.js', 'state.js', 'scenes.js'];
  function load(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = resolve;
      s.onerror = function () { console.warn('[loader] missing ' + src); resolve(); };
      document.body.appendChild(s);
    });
  }
  function seq(list) { return list.reduce(function (p, src) { return p.then(function () { return load(src); }); }, Promise.resolve()); }
  seq(CORE.map(function (f) { return ROOT + 'src/core/' + f; }))
    .then(function () { if (!REAL) installStubs(); })
    .then(function () { return seq(TEAMS.map(function (t) { return ROOT + 'src/' + t + '/manifest.js'; })); })
    .then(function () {
      var files = [];
      TEAMS.forEach(function (t) { (G.manifest[t] || []).forEach(function (f) { files.push(ROOT + 'src/' + t + '/' + f); }); });
      return seq(files);
    })
    .then(function () { return load(ROOT + 'src/core/main.js'); })
    .then(buildDev);
})();

// =====================================================================================================
// STUBS — harness only. Contract shapes, toy behaviour.
// =====================================================================================================
function installStubs() {
  'use strict';
  var G = window.G, S = G.state, C = G.C;
  var toast = function (text, color) { G.emit('ui:toast', { text: text, color: color }); };

  // ---------- engine ----------
  var iconCache = {};
  function iconCanvas(desc, size) {
    var cv = document.createElement('canvas'); cv.width = cv.height = size;
    var c = cv.getContext('2d');
    c.fillStyle = (desc && desc.color) || '#888'; c.fillRect(2, 2, size - 4, size - 4);
    c.fillStyle = (desc && desc.accent) || '#0006'; c.fillRect(size / 2 - 3, size / 2 - 3, 6, 6);
    c.fillStyle = '#000'; c.font = 'bold 8px monospace'; c.fillText(String((desc && desc.shape) || '?').slice(0, 4), 3, size - 4);
    return cv;
  }
  var canvas = null, ctx = null;
  G.engine = {
    init: function (cv) {
      canvas = cv; ctx = cv.getContext('2d');
      var fit = function () { cv.width = Math.floor(innerWidth / 2); cv.height = Math.floor(innerHeight / 2); };
      fit(); addEventListener('resize', fit);
    },
    update: function () {},
    render: function () {
      if (!ctx) return;
      ctx.fillStyle = S.scene === 'town' ? '#1c2a1c' : (S.scene === 'dungeon' ? '#1a1620' : '#0b0a0f');
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (!S.map || !S.player) return;
      ctx.fillStyle = '#2a2433';
      for (var i = 0; i < 12; i++) ctx.fillRect((i * 53) % canvas.width, (i * 37) % canvas.height, 16, 8);
      ctx.fillStyle = '#d8c9a3'; ctx.fillRect(canvas.width / 2 - 4, canvas.height / 2 - 8, 8, 16);
    },
    worldToScreen: function (x, y) { return { x: x, y: y }; },
    screenToWorld: function (x, y) { return { x: x, y: y }; },
    getIcon: function (desc, size) { return iconCanvas(desc, size || 32); },
    getIconURL: function (desc, size) {
      size = size || 32;
      var k = JSON.stringify(desc) + size;
      return iconCache[k] || (iconCache[k] = iconCanvas(desc, size).toDataURL());
    },
    getPortrait: function (sprite, size) {
      size = size || 48;
      var cv = document.createElement('canvas'); cv.width = cv.height = size;
      var c = cv.getContext('2d'), u = size / 8;
      c.fillStyle = '#17141c'; c.fillRect(0, 0, size, size);
      c.fillStyle = (sprite && sprite.color) || '#888'; c.fillRect(u * 2, u * 3, u * 4, u * 4);
      c.fillStyle = '#e0b090'; c.fillRect(u * 3, u, u * 2, u * 2);
      c.fillStyle = (sprite && sprite.accent) || '#444'; c.fillRect(u * 2, u * 5, u * 4, u);
      return cv;
    },
    minimapCalls: 0,
    drawMinimap: function (c, w, h) {
      G.engine.minimapCalls++;
      c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#4a4354'; c.fillRect(w * 0.2, h * 0.2, w * 0.6, h * 0.25); c.fillRect(w * 0.45, h * 0.45, w * 0.12, h * 0.4);
      c.fillStyle = '#5fd35f'; c.fillRect(w / 2 - 2, h / 2 - 2, 4, 4);
    },
    sfxLog: [],
    sfx: function (name) { G.engine.sfxLog.push(name); if (G.engine.sfxLog.length > 30) G.engine.sfxLog.shift(); },
  };
  G.on('sfx', function (e) { G.engine.sfx(e.name); });

  // ---------- world ----------
  function blankMap(kind, depth, seed) {
    var w = 24, h = 24, n = w * h;
    return { w: w, h: h, kind: kind, depth: depth, theme: depth ? C.themeForDepth(depth) : 'town', seed: seed,
      tiles: new Uint8Array(n).fill(1), explored: new Uint8Array(n).fill(1), visible: new Uint8Array(n).fill(1),
      spawn: { x: 12, y: 12 }, rooms: [], spawns: [], props: [] };
  }
  G.world = {
    generateTown: function (seed) { return blankMap('town', 0, seed); },
    generateDungeon: function (depth, seed) { return blankMap('dungeon', depth, seed); },
  };

  // ---------- game ----------
  function sk(id, name, classId, tree, shape, color, kind, tags, row, col, requires, desc) {
    return { id: id, name: name, classId: classId, tree: tree, icon: { shape: shape, color: color, accent: '#201820' }, desc: desc,
      maxRank: 5, reqLevel: 1 + row * 3, requires: requires || undefined, kind: kind, tags: tags, row: row, col: col };
  }
  var SKILLS = {};
  [
    sk('cleave', 'Cleave', 'warrior', 'arms', 'slash', '#d05040', 'active', ['aoe'], 0, 0, null, 'A wide swing that cuts every foe in front of you.'),
    sk('execute', 'Execute', 'warrior', 'arms', 'sword', '#e0e0e0', 'active', ['single'], 0, 2, null, 'A brutal overhead blow against one enemy.'),
    sk('whirlwind', 'Whirlwind', 'warrior', 'arms', 'whirl', '#c0c0ff', 'active', ['aoe'], 1, 0, 'cleave', 'Spin, striking everything around you.'),
    sk('rend', 'Rend', 'warrior', 'arms', 'dagger', '#a02020', 'passive', ['single'], 1, 2, 'execute', 'Your hits make enemies bleed.'),
    sk('leap', 'Leap', 'warrior', 'fury', 'leap', '#ffb040', 'active', ['mobility', 'aoe'], 0, 1, null, 'Jump to a foe and slam the ground.'),
    sk('warcry', 'War Cry', 'warrior', 'fury', 'buff', '#ffd94a', 'active', ['buff'], 1, 1, 'leap', 'Shout to raise your damage for a while.'),
    sk('ironskin', 'Iron Skin', 'warrior', 'guard', 'shield', '#8090a0', 'passive', ['defense'], 0, 0, null, 'Permanently increases armor.'),
    sk('bulwark', 'Bulwark', 'warrior', 'guard', 'aura', '#60a0e0', 'active', ['defense'], 1, 0, 'ironskin', 'Briefly block all damage.'),
    sk('firebolt', 'Firebolt', 'sorcerer', 'fire', 'fire', '#ff7020', 'active', ['single'], 0, 0, null, 'Hurl a bolt of flame at one enemy.'),
    sk('fireball', 'Fireball', 'sorcerer', 'fire', 'fire', '#ffb020', 'active', ['aoe'], 1, 0, 'firebolt', 'An exploding ball of fire.'),
    sk('frostnova', 'Frost Nova', 'sorcerer', 'frost', 'ice', '#80d0ff', 'active', ['aoe'], 0, 0, null, 'Freeze everything nearby.'),
    sk('icelance', 'Ice Lance', 'sorcerer', 'frost', 'ice', '#c0f0ff', 'active', ['single'], 0, 1, null, 'A piercing shard of ice.'),
    sk('chain', 'Chain Lightning', 'sorcerer', 'storm', 'bolt', '#ffff80', 'active', ['aoe'], 0, 0, null, 'Lightning that jumps between foes.'),
    sk('static', 'Static Mind', 'sorcerer', 'storm', 'orb', '#a080ff', 'passive', ['buff'], 1, 0, 'chain', 'More mana and mana regeneration.'),
  ].forEach(function (s) { SKILLS[s.id] = s; });
  var CLASSES = {
    warrior: { id: 'warrior', name: 'Warrior', desc: 'A wall of steel and fury. Wades into the pack and does not come out until it is dead.',
      sprite: { body: 'humanoid', color: '#a04030', accent: '#c8c8c8', scale: 1, weapon: 'sword' }, icon: { shape: 'sword', color: '#c8c8c8' },
      baseAttrs: { str: 10, dex: 6, int: 4, vit: 9 }, primaryStat: 'str', weaponTypes: ['sword', 'axe', 'mace'],
      trees: [{ id: 'arms', name: 'Arms', desc: 'Weapon mastery.', skills: ['cleave', 'execute', 'whirlwind', 'rend'] },
        { id: 'fury', name: 'Fury', desc: 'Rage and momentum.', skills: ['leap', 'warcry'] },
        { id: 'guard', name: 'Guard', desc: 'Outlast everything.', skills: ['ironskin', 'bulwark'] }] },
    sorcerer: { id: 'sorcerer', name: 'Sorcerer', desc: 'Fragile, brilliant, catastrophic. Burns, freezes and shocks from a safe distance.',
      sprite: { body: 'caster', color: '#4050c0', accent: '#ffd94a', scale: 1, weapon: 'staff' }, icon: { shape: 'staff', color: '#8060ff' },
      baseAttrs: { str: 4, dex: 6, int: 12, vit: 6 }, primaryStat: 'int', weaponTypes: ['staff', 'wand'],
      trees: [{ id: 'fire', name: 'Fire', desc: 'Burn it all.', skills: ['firebolt', 'fireball'] },
        { id: 'frost', name: 'Frost', desc: 'Control the field.', skills: ['frostnova', 'icelance'] },
        { id: 'storm', name: 'Storm', desc: 'Raw power.', skills: ['chain', 'static'] }] },
  };
  function xpFor(level) { return 100 * level; }
  function autoSpend() {
    var p = S.player;
    if (!p || !p.autoBuild) return;
    var cls = CLASSES[p.classId];
    while (p.attrPoints > 0) { p.attrs[cls.primaryStat]++; p.attrPoints--; }
    var guard = 50;
    while (p.skillPoints > 0 && guard--) {
      var want = p.autoBuild === 'balanced' ? ((Object.keys(p.skills).length % 2) ? 'aoe' : 'single') : p.autoBuild;
      var ids = Object.keys(SKILLS).filter(function (id) { return G.game.canLearn(id).ok; });
      if (!ids.length) break;
      var pick = ids.filter(function (id) { return SKILLS[id].tags.indexOf(want) >= 0; })[0] || ids[0];
      G.game.learnSkill(pick);
    }
    G.game.recomputeStats(p);
  }
  G.game = {
    CLASSES: CLASSES, SKILLS: SKILLS, attackCount: 0, skillUses: 0,
    createPlayer: function (classId, name) {
      var c = CLASSES[classId];
      var eq = {}; C.EQUIP_SLOTS.forEach(function (s) { eq[s] = null; });
      var stats = {}; C.STATS.forEach(function (s) { stats[s] = 0; });
      return { id: G.newId(), type: 'player', name: name, x: 0, y: 0, radius: 0.3, facing: 0, sprite: c.sprite, anim: 'idle', animT: 0, hitFlash: 0, dead: false,
        level: 1, hp: 1, mp: 1, stats: stats, effects: [], classId: classId, xp: 0, xpNext: xpFor(1),
        attrs: Object.assign({}, c.baseAttrs), attrPoints: 0, skillPoints: 1, skills: {}, skillBar: [null, null, null, null], cooldowns: {}, autoBuild: null,
        gold: 150, inventory: new Array(C.INV_SIZE).fill(null), equipment: eq, potions: { hp: 3, mp: 2 }, materials: { dust: 4, shard: 1, essence: 0 } };
    },
    revivePlayer: function () { var p = S.player; p.dead = false; p.hp = p.stats.hpMax; p.mp = p.stats.mpMax; },
    spawnMapEntities: function (map) {
      if (map.kind === 'town') {
        C.NPC_ROLES.forEach(function (role, i) {
          S.entities.push({ id: G.newId(), type: 'npc', role: role, name: ['Marta', 'Borin', 'Ysolde', 'Sister Anwen', 'Elder Corvin', 'Old Tam'][i],
            x: 5 + i * 2, y: 6, radius: 0.3, facing: 0, sprite: { body: 'humanoid', color: ['#8a6a3a', '#6b4a3a', '#6a3a8a', '#d8d8e8', '#5a5a6a', '#3a5a4a'][i], accent: '#d8c9a3', scale: 1 },
            anim: 'idle', animT: 0, hitFlash: 0, dead: false, level: 1, hp: 1, mp: 0, stats: {}, effects: [], faction: 'neutral' });
        });
      }
    },
    update: function (dt) {
      var p = S.player; if (!p) return;
      for (var k in p.cooldowns) { p.cooldowns[k] -= dt; if (p.cooldowns[k] <= 0) delete p.cooldowns[k]; }
      p.mp = Math.min(p.stats.mpMax, p.mp + dt * 2);
      G.game.potCd.hp = Math.max(0, G.game.potCd.hp - dt); G.game.potCd.mp = Math.max(0, G.game.potCd.mp - dt);
      if (G.input.attackHeld) G.game.heldTime = (G.game.heldTime || 0) + dt;
    },
    recomputeStats: function (ent) {
      var st = ent.stats; C.STATS.forEach(function (s) { st[s] = 0; });
      var a = ent.attrs;
      st.str = a.str; st.dex = a.dex; st.int = a.int; st.vit = a.vit;
      var mods = G.items.getEquipmentMods(ent);
      for (var k in mods) st[k] += mods[k];
      st.hpMax += 40 + st.vit * 6 + ent.level * 8; st.mpMax += 20 + st.int * 4 + ent.level * 3;
      st.critChance += 5; st.critDmg += 50; st.dmgPct += st.str; st.dodge += st.dex * 0.35; st.pickupRadius += 1.5; st.hpRegen += 0.5; st.mpRegen += 2;
      if (ent.skills.ironskin) st.armor += ent.skills.ironskin * 12;
      ent.hp = Math.min(ent.hp, st.hpMax); ent.mp = Math.min(ent.mp, st.mpMax);
      G.emit('player:stats', {});
    },
    gainXp: function (n) {
      var p = S.player; p.xp += n;
      while (p.xp >= p.xpNext) {
        p.xp -= p.xpNext; p.level++; p.xpNext = xpFor(p.level); p.attrPoints += 5; p.skillPoints += 1;
        G.game.recomputeStats(p); p.hp = p.stats.hpMax; p.mp = p.stats.mpMax;
        G.emit('player:levelup', { level: p.level }); autoSpend();
      }
      G.emit('player:xp', { xp: p.xp, xpNext: p.xpNext, gained: n });
    },
    spendAttr: function (attr) {
      var p = S.player; if (!(p.attrPoints > 0)) return false;
      p.attrs[attr]++; p.attrPoints--; G.game.recomputeStats(p); return true;
    },
    canLearn: function (id) {
      var p = S.player, s = SKILLS[id];
      if (!s || s.classId !== p.classId) return { ok: false, reason: 'Wrong class' };
      if ((p.skills[id] || 0) >= s.maxRank) return { ok: false, reason: 'Already mastered' };
      if (p.level < s.reqLevel) return { ok: false, reason: 'Requires level ' + s.reqLevel };
      if (s.requires && !p.skills[s.requires]) return { ok: false, reason: 'Requires ' + SKILLS[s.requires].name };
      if (p.skillPoints <= 0) return { ok: false, reason: 'No skill points' };
      return { ok: true };
    },
    learnSkill: function (id) {
      var p = S.player; if (!G.game.canLearn(id).ok) return false;
      p.skills[id] = (p.skills[id] || 0) + 1; p.skillPoints--;
      if (SKILLS[id].kind === 'active' && p.skillBar.indexOf(id) < 0) { var e = p.skillBar.indexOf(null); if (e >= 0) p.skillBar[e] = id; }
      G.game.recomputeStats(p); G.emit('skills:changed', {}); return true;
    },
    setSkillSlot: function (slot, id) { S.player.skillBar[slot] = id; G.emit('skills:changed', {}); },
    getRespecCost: function () { return S.player ? S.player.level * 50 : 0; },
    potCd: { hp: 0, mp: 0 },
    getPotionCooldown: function (kind) { return Math.max(0, G.game.potCd[kind] || 0); },
    respec: function () {
      var p = S.player, cost = p.level * 50; if (p.gold < cost) return false;
      p.gold -= cost; G.emit('gold:changed', { gold: p.gold, delta: -cost });
      var n = 0; for (var k in p.skills) n += p.skills[k];
      p.skillPoints += n; p.skills = {}; p.skillBar = [null, null, null, null];
      var base = CLASSES[p.classId].baseAttrs;
      ['str', 'dex', 'int', 'vit'].forEach(function (a) { p.attrPoints += p.attrs[a] - base[a]; p.attrs[a] = base[a]; });
      G.game.recomputeStats(p); G.emit('skills:changed', {}); autoSpend(); return true;
    },
    setAutoBuild: function (mode) { S.player.autoBuild = mode; autoSpend(); G.emit('skills:changed', {}); },
    getSkillInfo: function (id) {
      var p = S.player, s = SKILLS[id], can = G.game.canLearn(id), rank = p.skills[id] || 0;
      return Object.assign({}, s, { rank: rank, nextRankDesc: '+' + (10 * (rank + 1)) + '% effect', mpCost: s.kind === 'active' ? 8 + s.row * 6 : 0,
        cooldown: s.kind === 'active' ? 2 + s.row * 4 : 0, cdRemaining: p.cooldowns[id] || 0, learnable: can.ok, lockedReason: can.reason });
    },
    useSkill: function (slot) {
      var p = S.player, id = p.skillBar[slot]; if (!id) return false;
      var i = G.game.getSkillInfo(id);
      if (p.cooldowns[id] > 0 || p.mp < i.mpCost) { G.emit('sfx', { name: 'error' }); return false; }
      p.mp -= i.mpCost; p.cooldowns[id] = i.cooldown; G.game.skillUses++; return true;
    },
    usePotion: function (kind) {
      var p = S.player; if (!(p.potions[kind] > 0)) { toast('No potions!', '#ff5b5b'); return false; }
      if (G.game.potCd[kind] > 0) { G.emit('sfx', { name: 'error' }); return false; }
      G.game.potCd[kind] = 4;
      p.potions[kind]--; if (kind === 'hp') p.hp = Math.min(p.stats.hpMax, p.hp + p.stats.hpMax * 0.4); else p.mp = Math.min(p.stats.mpMax, p.mp + p.stats.mpMax * 0.5);
      return true;
    },
    getXpForLevel: xpFor,
    getMonsterInfo: function (id) { return { name: id, sprite: { body: 'skeleton', color: '#ccc', accent: '#444', scale: 1 } }; },
    healPlayer: function () { var p = S.player; p.hp = p.stats.hpMax; p.mp = p.stats.mpMax; },
  };
  G.on('input:skill', function (e) { G.game.useSkill(e.slot); });
  G.on('input:potion', function (e) { G.game.usePotion(e.kind); });
  G.on('input:attack', function () { G.game.attackCount++; });

  // ---------- items ----------
  var BASES = [
    { baseId: 'sword', name: 'Sword', type: 'weapon', slot: 'weapon', weaponType: 'sword', shape: 'sword', base: { dmgMin: 3, dmgMax: 7, attackSpeed: 1.2 } },
    { baseId: 'staff', name: 'Staff', type: 'weapon', slot: 'weapon', weaponType: 'staff', twoHanded: true, shape: 'staff', base: { dmgMin: 4, dmgMax: 10, attackSpeed: 0.9 } },
    { baseId: 'buckler', name: 'Buckler', type: 'armor', slot: 'offhand', shape: 'shield', base: { armor: 6, block: 10 } },
    { baseId: 'cap', name: 'Cap', type: 'armor', slot: 'helm', shape: 'helm', base: { armor: 4 } },
    { baseId: 'mail', name: 'Mail', type: 'armor', slot: 'chest', shape: 'armor', base: { armor: 12 } },
    { baseId: 'grips', name: 'Grips', type: 'armor', slot: 'gloves', shape: 'gloves', base: { armor: 3 } },
    { baseId: 'treads', name: 'Treads', type: 'armor', slot: 'boots', shape: 'boots', base: { armor: 3 } },
    { baseId: 'sash', name: 'Sash', type: 'armor', slot: 'belt', shape: 'belt', base: { armor: 2 } },
    { baseId: 'charm', name: 'Charm', type: 'jewelry', slot: 'amulet', shape: 'amulet', base: {} },
    { baseId: 'band', name: 'Band', type: 'jewelry', slot: 'ring', shape: 'ring', base: {} },
  ];
  var MODS = ['str', 'vit', 'int', 'armor', 'critChance', 'hpMax', 'resFire', 'magicFind', 'attackSpeed', 'lifeSteal'];
  var RKEYS = Object.keys(C.RARITY);
  var vendors = {};
  function rollItem(o) {
    o = o || {};
    var r = o.rng || G.rng.global;

    var p = S.player, res = GI.previewSellAtOrBelow(r);
    p.inventory.forEach(function (it, i) { if (it && !NOBULK(it) && RO(it.rarity) <= RO(r)) p.inventory[i] = null; });
    addGold(res.gold); invChanged(); return res;
  };
  var SORTK = { rarity: function (a, b) { return RO(b.rarity) - RO(a.rarity); }, level: function (a, b) { return b.ilvl - a.ilvl; }, value: function (a, b) { return b.value - a.value; },
    slot: function (a, b) { return String(a.slot).localeCompare(String(b.slot)); }, newest: function (a, b) { return (b.foundAt || 0) - (a.foundAt || 0); },
    upgrades: function (a, b) { return (GI.verdict(b) === 'up') - (GI.verdict(a) === 'up'); } };
  function sortArr(arr, mode) { var f = SORTK[mode] || SORTK.rarity; var items = arr.filter(Boolean).sort(function (a, b) { return f(a, b) || RO(b.rarity) - RO(a.rarity); }); for (var i = 0; i < arr.length; i++) arr[i] = items[i] || null; }
  GI.sortInventory = function (mode) { GI.lastSort = mode; sortArr(S.player.inventory, mode); invChanged(); };
  GI.sortStash = function (mode) { GI.lastStashSort = mode; sortArr(S.stash, mode); G.emit('inventory:changed', {}); };
  GI.getPile = function (pid) { return S.groundItems.filter(function (g) { return g.pileId === pid; }); };
  GI.pickup = function (gid) {
    var gi = S.groundItems.findIndex(function (g) { return g.id === gid; }); if (gi < 0) return false;
    var g = S.groundItems[gi];
    if (g.item.type === 'gold') { addGold(g.item.qty); S.groundItems.splice(gi, 1); return true; }
    if (!GI.addToInventory(g.item)) { toast('Your bag is full', '#ff5b5b'); return false; }
    S.groundItems.splice(gi, 1); G.emit('item:picked', { item: g.item }); return true;
  };
  GI.pickupPile = function (pid) { var t = 0, l = 0; GI.getPile(pid).forEach(function (g) { if (GI.pickup(g.id)) t++; else l++; }); return { taken: t, left: l }; };
  GI.LOOKS = { ash_plate: { name: 'Ash Plate', matched: { 2: '+5% armor', 4: '+10% life, embers trail your steps' } } };
  GG.getPallor = function () { var v = S.flags.pallor | 0; return { value: v, tier: Math.min(4, Math.floor(v / 25)), effects: v >= 25 ? ['Monsters +10% life'] : [] }; };
}

// =====================================================================================================

function buildDev() {

  sec('npc:interact');
  G.C.NPC_ROLES.forEach(function (role) {

  sec('input:ui (keys)');
  ['inventory', 'skills', 'quests', 'map', 'menu'].forEach(function (p) { b(p, function () { G.emit('input:ui', { panel: p }); }); });
  sec('revision 3/4');
  b('kill legendary', function () { kill('legendary'); });
  b('target legendary', function () { var e = { id: G.newId(), type: 'monster', faction: 'enemy', name: 'Ashgut, Warden of Ash', monsterId: 'brute', rarity: 'legendary', affixes: ['Nova', 'Hasted', 'Shielding', 'Thorned'], x: S.player.x + 2, y: S.player.y, dead: false, hp: 300, stats: { hpMax: 500 }, level: 9 }; S.entities.push(e); S.targetId = e.id; });
  b('boss in view', function () { S.entities.push({ id: G.newId(), type: 'monster', faction: 'enemy', name: 'Morgrath', monsterId: 'boss_gravelord', rarity: 'boss', x: S.player.x + 2, y: S.player.y, dead: false, hp: 900, stats: { hpMax: 1000 }, level: 9 }); });
  b('find lore', function () { var f = S.flags.loreFound || []; var i = 0; while (f.indexOf(i) >= 0) i++; var it = { id: G.newId(), type: 'lore', loreIndex: i, name: 'Torn Page', rarity: 'rare', icon: { shape: 'scroll', color: '#d9cba3' } }; G.emit('item:picked', { item: it }); G.emit('lore:found', { loreIndex: i }); });

  b('lockdown wave', function () { G.game.lock = G.game.lock ? { room: {}, wave: Math.min(3, G.game.lock.wave + 1), waves: 3 } : { room: {}, wave: 1, waves: 3 }; S.flags.sealed = true; if (G.game.lock.wave === 1) G.emit('room:locked', { room: {} }); });
  sec('misc');

    S.groundItems.push({ id: G.newId(), x: p.x + 1, y: p.y, pileId: pid, item: { type: 'gold', qty: 57, name: 'Gold', rarity: 'common', icon: { shape: 'gold', color: '#ffd94a' } } });
    G.emit('pile:open', { pileId: pid });
  });
  b('fill bag junk', function () { for (var i = 0; i < 12; i++) pick(i % 3 ? 'common' : 'magic'); });
  b('look+awaken item', function () {
    var it = G.items.rollItem({ level: S.player.level, rarity: 'rare', slot: 'chest' }); it.look = { family: 'ash_plate', palette: 0 }; it.kills = 180;
    it.awakened = [{ stat: 'resFire', value: 12 }]; it.bleached = true; it.hidden = { stat: 'dmgPct', value: 9 };
    var h2 = G.items.rollItem({ level: S.player.level, rarity: 'magic', slot: 'helm' }); h2.look = { family: 'ash_plate', palette: 0 };

  });
  b('pallor +25', function () { S.flags.pallorUnlocked = true; S.flags.pallor = Math.min(100, (S.flags.pallor | 0) + 25); });
  b('floor name', function () { if (S.map) { S.map.floorName = 'The Drowned Ossuary'; S.map.variant = { id: 'v', name: 'Flooded', palette: { accent: '#7fd4ff' } }; } G.emit('scene:changed', { scene: S.scene, depth: S.depth, map: S.map }); });
  b('play ending', function () { G.emit('quest:completed', { quest: { id: 'main_8', main: true, status: 'done' } }); });
  b('edit hud', function () { G.ui._editHud(); });
  b('toast', function () { G.emit('ui:toast', { text: 'A cold wind rises from below.', color: '#7fd4ff' }); });
  b('save', function () { out.textContent = 'save -> ' + G.meta.save(); });
  b('corrupt save', function () { localStorage.setItem(G.meta._KEY, '{"v":1,"player":'); out.textContent = 'hasSave -> ' + G.meta.hasSave(); });
  b('old-version save', function () { localStorage.setItem(G.meta._KEY, '{"v":0,"player":{}}'); out.textContent = 'hasSave -> ' + G.meta.hasSave() + ', load -> ' + G.meta.load(); });
  b('register sw', function () {
    navigator.serviceWorker.register('../sw.js').then(function (r) { out.textContent = 'sw registered, scope ' + r.scope; }, function (e) { out.textContent = 'sw failed: ' + e; });
  });
  b('state', function () {
    out.textContent = JSON.stringify({ scene: S.scene, depth: S.depth, paused: S.paused, attackHeld: G.input.attackHeld, attacks: G.game.attackCount, skillUses: G.game.skillUses,
      open: G.ui.isOpen(), errors: window.__errors.length, minimap: G.engine.minimapCalls, sfx: (G.engine.sfxLog || []).slice(-5) }, null, 1);
  });
  // ---------- Revision 7 stubs + checks (contract shapes) ----------
  sec('revision 7');
  (function () {
    var I = G.items, held = [], reg = {}, auto = false, combined = false;
    var PAGES = [{ id: 'ash_plate', name: 'Ash Plate', kind: 'heavy', hint: 'Acts II-III (depth 20-47)', slots: ['helm', 'chest', 'gloves', 'boots'] },
      { id: 'blackiron', name: 'Blackiron', kind: 'weapon', hint: 'Acts II-III (depth 20-47)', slots: ['sword', 'axe', 'mace'] }];
    function entry(it) { return it && it.slot === 'chest' ? { page: 'ash_plate', key: 'chest' } : null; }
    I.collection = {
      entryOf: entry, isWanted: function (it) { var e = entry(it); return !!e && !reg[e.key]; },
      getPages: function () { return PAGES.map(function (pg) { var n = pg.slots.filter(function (s) { return reg[s]; }).length;
        return { id: pg.id, name: pg.name, kind: pg.kind, hint: pg.hint, count: n, total: pg.slots.length, done: n === pg.slots.length, reward: { buff: [['hpMax', 15]] },
          entries: pg.slots.map(function (s) { return { key: s, label: s, have: !!reg[s], item: reg[s] ? { name: 'Ash ' + s, rarity: 'rare' } : null }; }) }; }); },
      getProgress: function () { return { pages: 0, total: 2, tiers: [{ at: 5, need: 5, name: 'Apprentice Collector', claimed: false, mats: { shard: 10 }, buff: null, stash: 0 }], titles: [], stash: 0 }; },
      register: function (i) { var it = S.player.inventory[i], e = entry(it); if (!e || reg[e.key]) return { ok: false }; reg[e.key] = true; S.player.inventory[i] = null;
        G.emit('collection:registered', { page: e.page, entry: e.key, item: it }); G.emit('inventory:changed', {}); return { ok: true, page: e.page, entry: e.key }; },
      registerAll: function () { return 0; }, isAuto: function () { return auto; }, setAuto: function (v) { auto = !!v; },
    };
    I.RELIC_IDS = []; I.RELICS = {};
    for (var i = 1; i <= 10; i++) { I.RELIC_IDS.push('fallen_' + i); I.RELICS['fallen_' + i] = { id: 'fallen_' + i, name: 'Relic ' + i, classId: 'warrior', depth: i * 3, story: 'A story.', stats: [['hpMax', 10]], effect: null, effectText: '' }; }
    I.RELICS_COMBINED = { name: 'Ember-Heir', title: 'Heir of the Fallen', story: 'Ten lives.', stats: [['dmgPct', 25]], effectText: 'The fallen fight beside you.' };
    I.hasRelic = function (id) { return held.indexOf(id) >= 0; }; I.relicCount = function () { return held.length; };

    function chest() { if (!S.player) { G.scenes.startNewGame(Object.keys(G.game.CLASSES || { warrior: 1 })[0], 'Tester'); } var it = G.items.rollItem({ level: S.player.level, rarity: 'rare', slot: 'chest' }); it.slot = 'chest'; it.sockets = [{ name: 'Ruby' }, null]; it.rarity = 'rift'; G.items.addToInventory(it); return it; }
    function note(s) { out.textContent += s + '\n'; }
    b('R7: wanted chest + pips', function () { chest(); G.ui.open('inventory'); });
    b('R7: open Curator', function () { chest(); G.emit('npc:interact', { role: 'curator' }); });
    b('R7: relics 10', function () { held = I.RELIC_IDS.slice(); G.ui.open('relics'); });
    b('R7: clear grade', function () { G.emit('floor:graded', { grade: 'S', score: 1.2, explored: 96, time: 70, par: 80, depth: S.depth }); });
    b('R7: event banner', function () { G.emit('event:start', { id: 'gauntlet', name: 'Run the Gauntlet', timer: 40, goal: 'Reach the beacon', progress: '' }); });
    b('R7: run checks', function () {
      out.textContent = '';
      var ok = function (name, cond) { note((cond ? 'PASS ' : 'FAIL ') + name); };
      held = []; combined = false; reg = {}; if (S.player) S.player.inventory.fill(null); G.ui.update(0.1);
      var it = chest(); G.ui.update(0.1);      // the HUD only shows banners once an update has seen the hero
      G.ui.open('inventory');
      var cells = document.querySelectorAll('.ed-grid .ed-cell');
      ok('socket pips on cell', !!document.querySelector('.ed-cell .sk b.f'));
      ok('rift glow class', !!document.querySelector('.ed-cell.rg4'));
      ok('book mark on wanted cell', !!document.querySelector('.ed-cell .bk'));
      ok('wanted never junk', !document.querySelector('.ed-cell.junk .bk'));
      G.ui.close();
      G.emit('npc:interact', { role: 'curator' });
      var row = [].filter.call(document.querySelectorAll('.ed-row[aria-label^="Hand in"]'), function (r) { return r.getAttribute('aria-label') === 'Hand in ' + it.name; })[0]; ok('curator hand-in row', !!row);      // a new hero's starting kit has a chest piece the book wants too: pick OUR item's row
      if (row) row.click();
      ok('registered (item consumed)', S.player.inventory.indexOf(it) < 0 && reg.chest === true);
      G.ui.close();
      held = I.RELIC_IDS.slice(); G.scenes.enterTown && S.scene !== 'town' && G.scenes.enterTown();
      G.ui.open('relics');
      ok('10 relic slots', document.querySelectorAll('.ed-relic.have').length === 10);
      var cb = [].filter.call(document.querySelectorAll('.ed-btn'), function (x) { return /Combine/.test(x.textContent); })[0];
      ok('combine button enabled in town', !!cb && !cb.disabled);
      if (cb) cb.click(); ok('combined', combined);
      G.ui.close();
      G.emit('floor:graded', { grade: 'A', explored: 80, time: 60, par: 70 });
      setTimeout(function () { ok('grade banner', /grade A/i.test((document.querySelector('.ed-banner b') || {}).textContent || '')); }, 1000);      // the HUD waits 0.9 s so the floor-name banner shows first
      G.emit('event:start', { id: 'gauntlet', name: 'Run the Gauntlet', timer: 40, goal: 'Reach the beacon', progress: '' });
      var ev = document.querySelector('.ed-event'); ok('event banner shown', !!ev && ev.style.display === 'block' && /0:40/.test(ev.textContent));
      G.emit('event:end', { id: 'gauntlet', name: 'Run the Gauntlet', success: true });
      ok('event ended state', /ok/.test((document.querySelector('.ed-event') || {}).className || ''));
      ok('no page errors', window.__errors.length === 0);
    });
  })();
  sec('save safety');
  b('save: run checks', function () {
    out.textContent = '';
    var ok = function (name, cond) { out.textContent += (cond ? 'PASS ' : 'FAIL ') + name + '\n'; };
    if (!S.player) { out.textContent = 'start a game first (chest button in revision 7)'; return; }
    var K = G.meta._KEY;
    G.emit('scene:changed', { scene: S.scene, depth: S.depth, map: S.map }); G.meta.save();
    ok('ring holds this hero', G.meta.listBackups().length >= 1);
    var main = localStorage.getItem(K);
    localStorage.setItem(K, '{"v":1,"player":'); ok('corrupt main -> hasSave false, backup offered', !G.meta.hasSave() && G.meta.listBackups().length >= 1);
    ok('restore backup', G.meta.restoreBackup(0) && G.meta.hasSave());
    G.meta.exportCode().then(function (code) {
      ok('export code', /^SLW[0-3]:/.test(code || ''));
      localStorage.removeItem(K);
      G.meta.parseCode(code).then(function (res) {
        ok('code parses', !!res && res.info.name === S.player.name);
        var keep = S.player; S.player = null; G.meta.applyImport(res.raw); S.player = keep;
        ok('import round trip', G.meta.hasSave());
        G.meta._noSave = false; G.meta.save();
      });
    });
  });
  dev.appendChild(out);
}
