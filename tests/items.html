    ok(I.upgradeCost(robe).classMat === 'forge_sorcerer' && !I.upgradeCost(plate).classMat, "the class's own armour weight needs it, other armour does not");
  });

  section('R7.11 Curator collection', function () {
    D.COLLECTION.protect = true;
    const p = mkPlayer('warrior', 40);
    S.flags = { maxDepth: 1, waypoints: [1], portalDepth: 0, visits: 0, kills: 0, deaths: 0 };
    const K = I.collection;
    const pages = K.getPages();
    ok(pages.length >= 40 && pages.every(function (pg) { return pg.total >= 1 && pg.hint && pg.reward && pg.reward.buff.length; }), 'a page per look family and set, each with entries, a drop hint and a reward', pages.length + ' pages');
    const setPg = pages.filter(function (pg) { return pg.id === 'ironbound'; })[0];
    ok(setPg && setPg.total === 5 && setPg.reward.title, 'set page: its five pieces, and a title reward');
    const helm = I.rollItem({ level: 10, rarity: 'rare', baseId: 'heavy_helm_2' });
    const fam = helm.look.family;
    ok(K.isWanted(helm) && I.getTooltip(helm).wanted === true, 'a piece that fills a missing entry is wanted (tooltip.wanted)');
    p.inventory[0] = helm; p.inventory[1] = I.rollItem({ level: 10, rarity: 'common', baseId: 'heavy_helm_2' });
    p.inventory[1].look = JSON.parse(JSON.stringify(helm.look));
    S.settings = { junk: { maxRarity: 'legendary', action: 'sell', auto: false, keepUpgrades: false, keepSocketed: false } };
    ok(I.isJunk(helm) === false && I.isJunk(p.inventory[1]) === false, 'wanted items are never junk');
    const sold = I.sellAllBelow('legendary');
    ok(p.inventory[0] === helm, 'and never mass-sold', JSON.stringify(sold));
    const r = K.register(0);
    ok(r.ok && r.page === fam && r.entry === 'helm' && !p.inventory[0], 'register consumes the item and fills the entry', JSON.stringify(r));
    ok(!K.isWanted(p.inventory[1]) && I.isJunk(p.inventory[1]), 'a duplicate is no longer wanted, so it may be junk');
    ok(K.register(1).ok === false && p.inventory[1], 'a duplicate cannot be registered');
    const pg = K.getPages().filter(function (x) { return x.id === fam; })[0];
    ok(pg.count === 1 && pg.entries.filter(function (e) { return e.have; })[0].key === 'helm', 'the book shows which piece is turned in');
    const mods0 = I.getEquipmentMods(p);
    let done = null;
    ['chest', 'gloves', 'boots'].forEach(function (s) {
      const it = I.rollItem({ level: 10, rarity: 'rare', baseId: 'heavy_' + s + '_2' }); it.look = JSON.parse(JSON.stringify(helm.look));
      p.inventory[5] = it; done = K.register(5);
    });
    ok(done && done.completed && T.events['ui:toast'].length > 0, 'completing a page reports it and toasts', JSON.stringify(done));
    const buff = K.getPages().filter(function (x) { return x.id === fam; })[0].reward.buff[0];
    eq(I.getEquipmentMods(p)[buff[0]] - mods0[buff[0]], buff[1], 'a completed page gives a permanent buff through getEquipmentMods');
    ok(JSON.stringify(JSON.parse(JSON.stringify(S.flags.collection))) === JSON.stringify(S.flags.collection), 'collection state is plain JSON');
    const target = D.COLLECTION_PAGES.filter(function (x) { return x.by === 'slot' && x.id !== fam; }).slice(0, 4);
    target.forEach(function (x) {
      x.entries.forEach(function (e) { const it = I.rollItem({ level: 10, rarity: 'rare', baseId: 'heavy_' + e.key + '_2' }); it.look = D.lookOf(x.id); p.inventory[6] = it; K.register(6); });
    });
    const prog = K.getProgress();
    ok(prog.pages === 5 && prog.tiers[0].claimed && !prog.tiers[1].claimed && S.flags.collection.titles.indexOf(prog.tiers[0].name) >= 0 && p.materials.shard >= 10, 'five pages claim the first milestone (materials + title)', JSON.stringify(prog.tiers[0]));
    const w = I.rollItem({ level: 20, rarity: 'rare', baseId: 'light_boots_4' }); w.look = D.lookOf('hollowmoth');
    const w2 = I.rollItem({ level: 20, rarity: 'rare', baseId: 'light_boots_4' }); w2.look = D.lookOf('hollowmoth'); w2.locked = true;
    p.inventory[10] = w; p.inventory[11] = w2;
    K.setAuto(true); clearEvents();
    G.emit('scene:changed', { scene: 'town' });
    ok(!p.inventory[10] && p.inventory[11] && K.isAuto(), 'auto-register on reaching town turns wanted pieces in, skipping locked ones');
    ok(K.entryOf(w) && K.entryOf(w).page === 'hollowmoth', 'entryOf names the page and entry');
    const un = I.rollItem({ level: 40, uniqueId: 'juggernaut' });
    ok(K.entryOf(un) && K.entryOf(un).key === 'juggernaut', 'a unique with its own family is its page entry');
    D.COLLECTION.protect = false; K.setAuto(false);
    S.flags = { maxDepth: 1, waypoints: [1], portalDepth: 0, visits: 0, kills: 0, deaths: 0 }; S.settings = {};
  });

  section('R7.10 relics of the Fallen', function () {
    const p = mkPlayer('ranger', 40);
    S.flags = { maxDepth: 1, waypoints: [1], portalDepth: 0, visits: 0, kills: 0, deaths: 0 };
    const ids = I.RELIC_IDS;
    ok(ids.length === 10 && ids.join() === 'fallen_1,fallen_2,fallen_3,fallen_4,fallen_5,fallen_6,fallen_7,fallen_8,fallen_9,fallen_10', 'ten relics with ids fallen_1 .. fallen_10');
    const depths = ids.map(function (i) { return I.RELICS[i].depth; }).sort(function (a, b) { return a - b; });
    ok(depths.every(function (d, i) { return i === 0 || d - depths[i - 1] >= 2; }) && new Set(ids.map(function (i) { return I.RELICS[i].classId; })).size === 4, 'spread out across the descent, mixing all four classes', depths.join());
    ok(I.RELICS.fallen_2.name.indexOf('Brannoc') === 0 && I.RELICS.fallen_4.depth === 16 && I.RELICS.fallen_8.depth === 24 && I.RELICS.fallen_9.depth === 28, 'the four story adventurers sit at their STORY.md depths');
    const base = I.getEquipmentMods(p);
    ok(I.grantRelic('fallen_2') && !I.grantRelic('fallen_2') && !I.grantRelic('nope') && S.flags.relics.length === 1, 'grantRelic stores the id once in flags.relics');
    eq(I.getEquipmentMods(p).armor - base.armor, 40, 'relic stats are permanent and flow through getEquipmentMods');
    ok(I.getRelicEffects().dash_shield_bash === true, 'combat effect ids via getRelicEffects');
    ok(!I.canCombineRelics() && I.combineRelics() === false, 'a partial set cannot combine and gives nothing extra');
    const m1 = I.getEquipmentMods(p).dmgPct;
    ids.forEach(function (i) { I.grantRelic(i); });
    ok(I.canCombineRelics() && I.relicCount() === 10, 'all ten held: ready to combine');
    ok(I.combineRelics() && I.relicsCombined() && !I.canCombineRelics(), 'combineRelics pays once');
    ok(I.getEquipmentMods(p).dmgPct - m1 >= I.RELICS_COMBINED.stats[1][1] && I.getRelicEffects().ember_heir, 'the combined reward is far larger than any single relic');
    ok(JSON.stringify(JSON.parse(JSON.stringify(S.flags))) === JSON.stringify(S.flags), 'relic state is plain JSON');
    S.flags = { maxDepth: 1, waypoints: [1], portalDepth: 0, visits: 0, kills: 0, deaths: 0 };
  });

  section('R7.1 Unique / Rift stay rarer than Mythic; drop table per depth band', function () {
    mkPlayer('warrior', 30);
    const maxCorrupt = D.CORRUPT.maxChance * Math.max.apply(null, Object.keys(D.CORRUPT.source).map(function (k) { return D.CORRUPT.source[k]; }));
    ok(maxCorrupt * D.CORRUPT.uniqueP < D.BASE_P.mythic && D.RIFT_P * 2 < maxCorrupt * D.CORRUPT.uniqueP, 'worst-case Unique rate < Mythic rate, Rift rate < Unique rate', (maxCorrupt * D.CORRUPT.uniqueP * 100).toFixed(4) + '% vs ' + (D.BASE_P.mythic * 100).toFixed(4) + '%');
    const rows = [];
    [6, 15, 25].forEach(function (d) {
      const c = {}; let n = 0, eq = 0, tainted = 0;
      for (let i = 0; i < 3000; i++) {
        I.rollLoot({ source: i % 3 ? 'monster' : 'boss', level: d }).items.forEach(function (it) {
          if (!D.isEquip(it)) return; n++; c[it.rarity] = (c[it.rarity] || 0) + 1; if (it.corrupted) tainted++;
        });
      }
      rows.push('depth ' + d + ' (' + n + ' gear): ' + Object.keys(C.RARITY).map(function (k) { return k + ' ' + ((c[k] || 0) / n * 100).toFixed(3) + '%'; }).join(', ') + ', tainted ' + (tainted / n * 100).toFixed(2) + '%');
      ok(!c.unique || c.unique / n < 0.0005, 'depth ' + d + ': Unique share tiny');
    });
    ok(true, 'drop table', rows.join(' || '));
  });

  section('R8.1 chute, surface crate, town-only rules', function () {
    const p = mkPlayer('warrior', 30);
    S.scene = 'dungeon'; S.settings = { junk: { maxRarity: 'common', action: 'sell', auto: true, keepUpgrades: false, keepSocketed: false } };
    const a = give({ level: 10, rarity: 'common', slot: 'helm' }), b = give({ level: 10, rarity: 'rare', slot: 'boots' }), c = give({ level: 10, rarity: 'common', slot: 'belt' });
    clearEvents();
    ok(I.sell(idx(a)) === 0 && idx(a) >= 0 && T.events['ui:toast'].length === 1, 'sell is refused outside town with a toast');
    ok(I.salvage(idx(a)) === false && I.sellAllBelow('rare') === 0 && I.sellAtOrBelow('rare').count === 0, 'salvage and mass-sell refused outside town');
    ok(I.collection.register(idx(b)).ok === false && idx(b) >= 0, 'Curator registration refused outside town');
    ok(I.previewSendJunk().count === 2, 'two junk items would be sent', I.previewSendJunk().count);
    const r = I.sendJunk();
    ok(r.count === 2 && idx(a) < 0 && idx(c) < 0 && idx(b) >= 0 && S.surface.length === 2, 'sendJunk sends junk up the chute and keeps the rest', JSON.stringify(r));
    ok(I.chuteSend(idx(b)) === 1 && idx(b) < 0 && S.surface.length === 3 && I.chuteSend([40, 41]) === 0, 'chuteSend(index) and empty cells');
    const c2 = give({ level: 10, rarity: 'rare', slot: 'ring' }), c3 = give({ level: 10, rarity: 'rare', slot: 'amulet' });
    eq(I.chuteSend([idx(c2), idx(c3)]), 2, 'chuteSend(indices) sends several');
    ok(JSON.stringify(JSON.parse(JSON.stringify(S.surface))) === JSON.stringify(S.surface), 'state.surface is plain JSON');
    ok(I.surfaceTake(0) && S.surface.length === 4 && idx(a) >= 0 && inv().filter(Boolean).length === 1, 'surfaceTake works anywhere and moves the item into the bag');
    ok(I.surfaceSell(0) === 0 && S.surface.length === 4, 'surface selling is town-only too');
    S.scene = 'town';
    const g0 = p.gold;
    ok(I.surfaceSell(0) > 0 && p.gold > g0 && S.surface.length === 3, 'in town the surface crate sells');
    const d0 = p.materials.dust;
    ok(I.surfaceSalvage(0) && S.surface.length === 2 && (p.materials.dust > d0 || p.materials.shard > 0), 'salvages');
    ok(I.surfaceStash(0) && S.surface.length === 1 && S.stash.filter(Boolean).length === 1, 'stashes');
    const w = I.rollItem({ level: 20, rarity: 'rare', baseId: 'light_boots_4' }); w.look = D.lookOf('hollowmoth');
    S.surface.push(w);
    D.COLLECTION.protect = false;
    const rr = I.surfaceRegister(S.surface.length - 1);
    ok(rr.ok && S.surface.indexOf(w) < 0, 'registers with the Curator from the crate');
    S.surface = []; S.settings = {};
  });

  section('R8.7 out-of-class weapons', function () {
    const p = mkPlayer('warrior', 30);
    const bow = I.rollItem({ level: 30, rarity: 'rare', baseId: 'bow_4' }), sword = I.rollItem({ level: 30, rarity: 'rare', baseId: 'sword_4' });
    const pen = I.classPenalty(bow);
    ok(pen && pen.dmgPct === -35 && pen.text && I.classPenalty(sword) === null && I.classPenalty(bow, 'ranger') === null, 'classPenalty: a bow is penalised for a warrior only');
    ok(I.classPenalty(I.rollItem({ level: 10, rarity: 'rare', baseId: 'shield_2' })) === null, 'armour and off-hands carry no penalty');
    const tip = I.getTooltip(bow);
    ok(tip.penalty && tip.lines.some(function (l) { return l.text === pen.text && l.color === '#ff5b5b'; }), 'the tooltip shows it in red');
    ok(I.power(bow, 'warrior') < I.power(bow, 'ranger') * 0.8, 'Power accounts for it', I.power(bow, 'warrior') + ' vs ' + I.power(bow, 'ranger'));
    G.game = { CLASSES: { warrior: { primaryStat: 'str', weaponTypes: ['sword', 'bow'] } }, recomputeStats: function () {} };
    ok(I.classPenalty(bow) === null, 'reads G.game.CLASSES[classId].weaponTypes');
    delete G.game; G.game = { recomputeStats: function () { T.recomputes++; } };
  });

  section('R8.5 auto-sort', function () {
    const p = mkPlayer('warrior', 30);
    S.settings = { sort: 'level' };
    give({ level: 5, rarity: 'common', slot: 'helm' }); give({ level: 25, rarity: 'common', slot: 'boots' }); give({ level: 15, rarity: 'common', slot: 'belt' });
    ok(inv()[0].ilvl >= inv()[1].ilvl && inv()[1].ilvl >= inv()[2].ilvl, 'items entering the bag are sorted by the chosen mode', inv().slice(0, 3).map(function (x) { return x.ilvl; }).join());
    S.settings = { sort: 'level', autoSort: false };
    give({ level: 40, rarity: 'common', slot: 'gloves' });
    ok(inv()[3] && inv()[3].ilvl > 25, 'autoSort: false leaves new items where they land', inv().slice(0, 5).map(function (x) { return x ? x.ilvl : '-'; }).join());
    ok(I.autoSort() === false, 'autoSort() reports false when off');
    S.settings = {};
    ok(I.autoSort() === false, 'no mode chosen: nothing is sorted');
    S.settings = { sort: 'level' };
    p.inventory[0] = null; I.stashDeposit(1);
    ok(I.autoSort() === true, 'autoSort() sorts bag and stash');
    S.settings = {};
  });

  section('R8.13 crate capacity', function () {
    const p = mkPlayer('warrior', 30);
    S.scene = 'dungeon'; S.settings = { junk: { maxRarity: 'common', action: 'sell', auto: false, keepUpgrades: false, keepSocketed: false } };
    eq(I.SURFACE_SIZE, 300, 'SURFACE_SIZE is 300');
    S.surface = []; for (let i = 0; i < I.SURFACE_SIZE - 2; i++) S.surface.push(I.rollItem({ level: 5, rarity: 'common', slot: 'helm' }));
    eq(I.surfaceSpace(), 2, 'surfaceSpace');
    const cheap = give({ level: 2, rarity: 'common', slot: 'belt' }), dear = give({ level: 40, rarity: 'common', slot: 'chest' }), mid = give({ level: 20, rarity: 'common', slot: 'boots' });
    clearEvents();
    const r = I.sendJunk();
    ok(r.count === 2 && r.left === 1 && idx(cheap) >= 0 && idx(dear) < 0 && idx(mid) < 0, 'sendJunk sends only what fits, best value first', JSON.stringify(r));
    eq(S.surface.length, I.SURFACE_SIZE, 'crate is now full');
    clearEvents();
    ok(I.chuteSend(idx(cheap)) === 0 && idx(cheap) >= 0 && T.events['ui:toast'].length === 1, 'chuteSend refuses with a toast once full');
    eq(I.surfaceSpace(), 0, 'no space left');
    S.surface.push(I.rollItem({ level: 5, rarity: 'common', slot: 'helm' }));
    ok(S.surface.length === I.SURFACE_SIZE + 1 && I.surfaceSpace() === 0 && I.chuteSend(idx(cheap)) === 0, 'an over-full save keeps its items but accepts no more');
    I.surfaceTake(0); I.surfaceTake(0);
    ok(I.surfaceSpace() === 1, 'space returns once under the cap');
    S.surface = []; S.settings = {};
  });

  section('Starter gear', function () {
    const want = { warrior: ['sword', 'axe', 'mace'], ranger: ['bow'], sorcerer: ['staff', 'wand'], necromancer: ['wand', 'dagger'] };
    Object.keys(want).forEach(function (c) {
      const p = { classId: c, level: 1, gold: 0 };     // deliberately bare: no inventory/equipment yet
      S.player = p;
      I.grantStarterGear(p);
      const w = p.equipment.weapon;
      ok(w && w.rarity === 'common' && want[c].indexOf(w.weaponType) >= 0 && w.reqLevel === 1 && p.potions.hp >= 3 && p.potions.mp >= 1 &&
        p.inventory.length === C.INV_SIZE && C.EQUIP_SLOTS.every(function (s) { return s in p.equipment; }) && !(w.twoHanded && p.equipment.offhand),
        c + ': common ' + (w && w.name) + ' equipped + potions');
    });
    G.game.CLASSES = { paladin: { primaryStat: 'str', weaponTypes: ['mace'] } };
    const p = { classId: 'paladin', level: 1 };
    S.player = p;
    I.grantStarterGear(p);
    ok(p.equipment.weapon && p.equipment.weapon.weaponType === 'mace', 'unknown class falls back to G.game.CLASSES weaponTypes', p.equipment.weapon && p.equipment.weapon.name);
    delete G.game.CLASSES;
    delete G.game;
    mkPlayer('warrior', 20);
    const s = give({ level: 10, baseId: 'sword_2', rarity: 'common' });
    ok(I.equip(idx(s)), 'equip works when G.game is missing (guarded)');
    G.game = { recomputeStats: function () { T.recomputes++; } };
  });

  // ---- report ----
  function report() {
    const box = $('asserts');
    let pass = 0, fail = 0, g = '', html = '';
    T.results.forEach(function (r) {
      if (r.group !== g) { g = r.group; html += '<div style="color:#ff8a2b;margin-top:6px">' + esc(g) + '</div>'; }
      if (r.pass) pass++; else fail++;
      html += '<div class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '  ' + esc(r.name) + (r.detail ? '  <span style="color:#888">— ' + esc(r.detail) + '</span>' : '') + '</div>';
    });
    box.innerHTML = html;
    T.pass = pass; T.fail = fail;
    $('summary').innerHTML = '<span class="' + (fail ? 'fail' : 'pass') + '">' + pass + ' passed, ' + fail + ' failed</span>';
  }
  report();
  mkPlayer($('cls').value, +$('lvl').value);
  T.done = true;
}
</script>
